veos:
    # Define the global vEOS node parameters
    username: cvpadmin
    password: cvp123!
    version: 4.35.4M

generic:
    # Define the global generic node parameters
    version: ubuntu-2204-lts
    username: ansible
    password: ansible

cvp:
    # Define the global CVP node parameters
    username: root
    password: cvproot
    version: 2026.2.0
    instance: singlenode

nodes:
# Define individual node parameters
#   - Parameters here will override global parameters

# ===== CVP =====
- cvp:
    ip_addr: 192.168.0.5
    node_type: cvp
    auto_configuration: true
    ntp_ip: 0.pool.ntp.org   # optional
    instance_type: xlarge
    onboard_device: true
    ztp_dhcp:
      enabled: true
    firstname: Act
    lastname: AutoConfig
    email: "auto_config_act@arista.com"

- DC1-SPINE1:
    ip_addr: 192.168.0.10
    node_type: veos
    ztp: true
    serial_number: SN-DC1-SPINE1
