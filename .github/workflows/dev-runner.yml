name: AVD CI/CD Pipeline

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  GITHUB_ACTIONS_BOT_NAME: 'github-actions[bot]'
  GITHUB_ACTIONS_BOT_EMAIL: 'github-actions[bot]@users.noreply.github.com'
  AVD_OUTPUT_DIR: 'avd_project/AVD-information'

jobs:
  lint:
    name: Lint Configuration
    runs-on: [self-hosted, dev]
    if: "!contains(github.event.head_commit.message, '[skip-ci]')"
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AVDCI6_PAT }}

      - name: Lint YAML in inventory
        run: yamllint avd_project/inventory/

      - name: Lint Ansible playbooks
        run: ansible-lint avd_project/playbooks/

  build:
    name: Build AVD Configurations
    needs: lint
    runs-on: [self-hosted, dev]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AVDCI6_PAT }}

      - name: Generate AVD fabric configurations
        run: make build
        working-directory: ${{ github.workspace }}

      - name: Verify configurations generated
        run: |
          if [ ! -d "${{ env.AVD_OUTPUT_DIR }}/configs" ]; then
            echo "ERROR: Configuration output directory not found!"
            exit 1
          fi
          CONFIG_COUNT=$(find ${{ env.AVD_OUTPUT_DIR }}/configs -name "*.cfg" | wc -l)
          echo "✓ Generated $CONFIG_COUNT device configurations"

      - name: Commit and push build artifacts
        if: success()
        run: |
          git config user.name "${{ env.GITHUB_ACTIONS_BOT_NAME }}"
          git config user.email "${{ env.GITHUB_ACTIONS_BOT_EMAIL }}"
          git add ${{ env.AVD_OUTPUT_DIR }}/

          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: update AVD configurations [skip-ci]"
            git remote set-url origin https://x-access-token:${{ secrets.AVDCI6_PAT }}@github.com/${{ github.repository }}.git
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
            echo "✓ Pushed configuration changes"
          else
            echo "✓ No configuration changes to commit"
          fi

