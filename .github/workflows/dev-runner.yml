name: Dev AVD CI/CD Pipeline

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  GITHUB_ACTIONS_BOT_NAME: 'github-actions[bot]'
  GITHUB_ACTIONS_BOT_EMAIL: 'github-actions[bot]@users.noreply.github.com'
  AVD_OUTPUT_DIR: 'avd_project/AVD-information'

jobs:
  lint:
    name: Lint Configuration
    runs-on: [self-hosted, dev]
    if: "!contains(github.event.head_commit.message, '[skip-ci]')"
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
          token: ${{ secrets.AVDCI6_PAT }}

      - name: Detect venv activation script
        id: venv
        run: |
          if [ -f "/home/ansible/avdci6/.venv/bin/activate" ]; then
            echo "activate=/home/ansible/avdci6/.venv/bin/activate" >> $GITHUB_OUTPUT
            echo "✓ Found venv at /home/ansible/avdci6/.venv"
          else
            echo "ERROR: venv not found at /home/ansible/avdci6/.venv"
            echo "Checking for activation script..."
            find /home -name ".venv" -type d 2>/dev/null | head -3
            exit 1
          fi

      - name: Activate venv and verify tools
        run: |
          source ${{ steps.venv.outputs.activate }}
          which yamllint && yamllint --version
          which ansible-lint && ansible-lint --version

      - name: Lint YAML in inventory
        run: |
          source ${{ steps.venv.outputs.activate }}
          yamllint avd_project/inventory/

      - name: Lint Ansible playbooks
        run: |
          source ${{ steps.venv.outputs.activate }}
          ansible-lint avd_project/playbooks/

  build:
    name: Build AVD Configurations
    needs: lint
    runs-on: [self-hosted, dev]
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
          token: ${{ secrets.AVDCI6_PAT }}

      - name: Detect venv activation script
        id: venv
        run: |
          if [ -f "/home/ansible/avdci6/.venv/bin/activate" ]; then
            echo "activate=/home/ansible/avdci6/.venv/bin/activate" >> $GITHUB_OUTPUT
            echo "✓ Found venv at /home/ansible/avdci6/.venv"
          else
            echo "ERROR: venv not found at /home/ansible/avdci6/.venv"
            exit 1
          fi

      - name: Verify build environment
        run: |
          echo "Workspace: $(pwd)"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          which make && make --version
          which python3 && python3 --version
          echo "Activating venv..."
          source ${{ steps.venv.outputs.activate }}
          which ansible && ansible --version | head -1
          echo "✓ Build environment ready"

      - name: Generate AVD fabric configurations
        run: |
          source ${{ steps.venv.outputs.activate }}
          make dev-build

      - name: Verify configurations generated
        run: |
          if [ ! -d "${{ env.AVD_OUTPUT_DIR }}/configs" ]; then
            echo "ERROR: Configuration output directory not found!"
            exit 1
          fi
          CONFIG_COUNT=$(find ${{ env.AVD_OUTPUT_DIR }}/configs -name "*.cfg" | wc -l)
          echo "✓ Generated $CONFIG_COUNT device configurations"

      - name: Commit and push build artifacts
        if: success()
        run: |
          source ${{ steps.venv.outputs.activate }}
          git config user.name "${{ env.GITHUB_ACTIONS_BOT_NAME }}"
          git config user.email "${{ env.GITHUB_ACTIONS_BOT_EMAIL }}"

          # Add only committed artifacts, excluding temporary design files
          git add ${{ env.AVD_OUTPUT_DIR }}/configs/ ${{ env.AVD_OUTPUT_DIR }}/documentation/ 2>/dev/null || true
          git add ${{ env.AVD_OUTPUT_DIR }}/*.html 2>/dev/null || true

          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: update AVD configurations [skip-ci]"
            git remote set-url origin "https://oauth2:${{ secrets.AVDCI6_PAT }}@github.com/${{ github.repository }}.git"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
            echo "✓ Pushed configuration changes"
          else
            echo "✓ No configuration changes to commit"
          fi

  deploy:
    name: Deploy to CloudVision
    needs: build
    runs-on: [self-hosted, dev]
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
          token: ${{ secrets.AVDCI6_PAT }}

      - name: Detect venv activation script
        id: venv
        run: |
          if [ -f "/home/ansible/avdci6/.venv/bin/activate" ]; then
            echo "activate=/home/ansible/avdci6/.venv/bin/activate" >> $GITHUB_OUTPUT
            echo "✓ Found venv at /home/ansible/avdci6/.venv"
          else
            echo "ERROR: venv not found at /home/ansible/avdci6/.venv"
            exit 1
          fi

      - name: Deploy configurations to CloudVision Portal
        run: |
          source ${{ steps.venv.outputs.activate }}
          make dev-deploy

  wait-for-cloudvision:
    name: Wait for Network Convergence
    needs: deploy
    runs-on: [self-hosted, dev]
    timeout-minutes: 2
    steps:
      - name: Wait for CloudVision to process changes
        run: sleep 30

  validate:
    name: Validate Fabric State
    needs: wait-for-cloudvision
    runs-on: [self-hosted, dev]
    if: "!contains(github.event.head_commit.message, '[skip-ci]')"
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
          token: ${{ secrets.AVDCI6_PAT }}

      - name: Detect venv activation script
        id: venv
        run: |
          if [ -f "/home/ansible/avdci6/.venv/bin/activate" ]; then
            echo "activate=/home/ansible/avdci6/.venv/bin/activate" >> $GITHUB_OUTPUT
            echo "✓ Found venv at /home/ansible/avdci6/.venv"
          else
            echo "ERROR: venv not found at /home/ansible/avdci6/.venv"
            exit 1
          fi

      - name: Run ANTA validation tests
        run: |
          source ${{ steps.venv.outputs.activate }}
          make dev-validate

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4.3.6
        with:
          name: ANTA-Validation-Reports
          path: ${{ env.AVD_OUTPUT_DIR }}/anta/reports/
          retention-days: 30

      - name: Display validation summary
        if: always()
        run: |
          if [ -f "${{ env.AVD_OUTPUT_DIR }}/anta/reports/anta_report.md" ]; then
            echo "## ANTA Validation Results" >> $GITHUB_STEP_SUMMARY
            cat "${{ env.AVD_OUTPUT_DIR }}/anta/reports/anta_report.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠ Validation report not found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit and push validation reports
        if: always()
        run: |
          git config user.name "${{ env.GITHUB_ACTIONS_BOT_NAME }}"
          git config user.email "${{ env.GITHUB_ACTIONS_BOT_EMAIL }}"
          git add ${{ env.AVD_OUTPUT_DIR }}/anta/

          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: update ANTA validation reports [skip-ci]"
            git remote set-url origin "https://oauth2:${{ secrets.AVDCI6_PAT }}@github.com/${{ github.repository }}.git"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
            echo "✓ Pushed validation report changes"
          else
            echo "✓ No validation report changes to commit"
          fi

      - name: Validation Complete Summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✓ Dev Validation Complete

          ANTA tests have been executed against the dev fabric.

          ### Results
          - Check the **ANTA-Validation-Reports** artifact for detailed results
          - Review validation report above for test status
          - All test results have been committed to the branch

          ### Next Steps
          1. **Review validation results:**
             - If all tests pass: configurations are ready for prod merge
             - If tests failed: review errors and fix configuration issues

          2. **Ready for production?**
             - Once validation passes, merge this PR to main
             - This will trigger automatic prod deployment and validation
             - Monitor GitHub Actions for prod deployment progress

          ---
          **Repository:** ${{ github.repository }}
          **Branch:** ${{ github.ref_name }}
          EOF
