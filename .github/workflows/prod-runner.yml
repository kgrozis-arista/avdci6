name: Prod AVD CI/CD Pipeline

on:
  pull_request:
    types:
      - closed

env:
  GITHUB_ACTIONS_BOT_NAME: 'github-actions[bot]'
  GITHUB_ACTIONS_BOT_EMAIL: 'github-actions[bot]@users.noreply.github.com'
  AVD_OUTPUT_DIR: 'avd_project/AVD-information'

jobs:
  lint:
    name: Lint Configuration
    runs-on: [self-hosted, prod]
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.title, '[skip-ci]')
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
          token: ${{ secrets.AVDCI6_PAT }}

      - name: Detect venv activation script
        id: venv
        run: |
          if [ -f "/home/ansible/avdci6-prod/.venv/bin/activate" ]; then
            echo "activate=/home/ansible/avdci6-prod/.venv/bin/activate" >> $GITHUB_OUTPUT
            echo "✓ Found venv at /home/ansible/avdci6-prod/.venv"
          else
            echo "ERROR: venv not found at /home/ansible/avdci6-prod/.venv"
            echo "Checking for activation script..."
            find /home -name ".venv" -type d 2>/dev/null | head -3
            exit 1
          fi

      - name: Activate venv and verify tools
        run: |
          source ${{ steps.venv.outputs.activate }}
          which yamllint && yamllint --version
          which ansible-lint && ansible-lint --version

      - name: Lint YAML in inventory
        run: |
          source ${{ steps.venv.outputs.activate }}
          yamllint avd_project/inventory/

      - name: Lint Ansible playbooks
        run: |
          source ${{ steps.venv.outputs.activate }}
          ansible-lint avd_project/playbooks/

  build:
    name: Build AVD Configurations
    needs: lint
    runs-on: [self-hosted, prod]
    if: github.event.pull_request.merged == true
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
          token: ${{ secrets.AVDCI6_PAT }}

      - name: Detect venv activation script
        id: venv
        run: |
          if [ -f "/home/ansible/avdci6-prod/.venv/bin/activate" ]; then
            echo "activate=/home/ansible/avdci6-prod/.venv/bin/activate" >> $GITHUB_OUTPUT
            echo "✓ Found venv at /home/ansible/avdci6-prod/.venv"
          else
            echo "ERROR: venv not found at /home/ansible/avdci6-prod/.venv"
            exit 1
          fi

      - name: Verify build environment
        run: |
          echo "Workspace: $(pwd)"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          which make && make --version
          which python3 && python3 --version
          echo "Activating venv..."
          source ${{ steps.venv.outputs.activate }}
          which ansible && ansible --version | head -1
          echo "✓ Build environment ready"

      - name: Generate AVD fabric configurations
        run: |
          source ${{ steps.venv.outputs.activate }}
          make prod-build

      - name: Verify configurations generated
        run: |
          if [ ! -d "${{ env.AVD_OUTPUT_DIR }}/intended/configs" ]; then
            echo "ERROR: Configuration output directory not found!"
            exit 1
          fi
          CONFIG_COUNT=$(find ${{ env.AVD_OUTPUT_DIR }}/intended/configs -name "*.cfg" | wc -l)
          echo "✓ Generated $CONFIG_COUNT device configurations"

      - name: Commit and push build artifacts
        if: success()
        run: |
          source ${{ steps.venv.outputs.activate }}
          git config user.name "${{ env.GITHUB_ACTIONS_BOT_NAME }}"
          git config user.email "${{ env.GITHUB_ACTIONS_BOT_EMAIL }}"

          # Add only committed artifacts, excluding temporary design files
          git add ${{ env.AVD_OUTPUT_DIR }}/intended/configs/ 2>/dev/null || true
          git add ${{ env.AVD_OUTPUT_DIR }}/intended/structured_configs/ 2>/dev/null || true
          git add ${{ env.AVD_OUTPUT_DIR }}/intended/documentation/ 2>/dev/null || true
          git add ${{ env.AVD_OUTPUT_DIR }}/*.html 2>/dev/null || true

          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: update AVD configurations [skip-ci]"
            git remote set-url origin "https://oauth2:${{ secrets.AVDCI6_PAT }}@github.com/${{ github.repository }}.git"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
            echo "✓ Pushed configuration changes"
          else
            echo "✓ No configuration changes to commit"
          fi

  deploy:
    name: Deploy to CloudVision
    needs: build
    runs-on: [self-hosted, prod]
    if: github.event.pull_request.merged == true
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
          token: ${{ secrets.AVDCI6_PAT }}

      - name: Detect venv activation script
        id: venv
        run: |
          if [ -f "/home/ansible/avdci6-prod/.venv/bin/activate" ]; then
            echo "activate=/home/ansible/avdci6-prod/.venv/bin/activate" >> $GITHUB_OUTPUT
            echo "✓ Found venv at /home/ansible/avdci6-prod/.venv"
          else
            echo "ERROR: venv not found at /home/ansible/avdci6-prod/.venv"
            exit 1
          fi

      - name: Deploy configurations to CloudVision Portal (Prod)
        run: |
          source ${{ steps.venv.outputs.activate }}
          make prod-deploy

      - name: Wait for CloudVision to process changes
        run: sleep 30

      - name: Post-Deployment Instructions
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✓ Prod Deployment Complete

          Configurations have been deployed to **CloudVision Portal (Production)**.

          ### Next Steps — Review & Approve Change Control

          1. **Open CloudVision Portal:**
             - Navigate to your prod CloudVision instance
             - Go to **Change Control** section

          2. **Review the deployment:**
             - Look for the latest change control with the deployment timestamp
             - Review the configuration changes
             - Verify all devices and interfaces are correct

          3. **Approve & Deploy:**
             - Click **Approve** to authorize the change control
             - Devices will receive the configuration
             - Monitor the rollout in CloudVision

          4. **Verify Devices:**
             - Once approved, devices will receive configurations
             - Check device status in CloudVision: **Devices → Compliance**
             - Verify no errors or warnings

          ⏱️ **Deployment Timeline:**
          - Configuration staging: Immediate (when this job completed)
          - Configuration push: After you approve in CloudVision
          - Device configuration: ~1-5 minutes per device

          💡 **Tips:**
          - Use `show configuration | grep <keyword>` on devices to verify
          - Monitor `show bgp summary` for control plane convergence
          - Check `show vxlan tunnel` to verify VXLAN tunnels are up

          ---
          **Repository:** ${{ github.repository }}
          **Branch:** ${{ github.ref_name }}
          **Commit:** ${{ github.event.pull_request.merge_commit_sha }}
          EOF
