name: 'Prod Manual Validation'

on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      name:
        # Friendly description to be shown in the UI instead of 'name'
        description: 'Validate'
        # Default value if no value is explicitly provided
        default: 'Validate'
        # Input has to be provided for the workflow to run
        required: false
        # The data type of the input
        type: string

jobs:
  Test:
    name: Test
    runs-on: [self-hosted, prod]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@master
        with:
          # Git Personal Access Token for repository access
          token: ${{ secrets.TENANTS }}

      - name: Run AVD EOS Validate State Playbook against ACT
        run: |
          ansible-playbook -i inventory/inventory.yml playbooks/fabric-validation.yml --skip-tags "ntp,reload_cause,mlag,optional"

      - name: Upload verification reports to github
        uses: actions/upload-artifact@master
        with:
            name: ValidationReport
            path: DC-information/reports/

      - name: Display verification report on github
        run: |
          cat DC-information/reports/DC-state.md >> $GITHUB_STEP_SUMMARY
     
      - name: Set up git to add build changes to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit and push test changes to repo
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.TENANTS }}@github.com/${{ github.repository }}.git
          git add .
          git commit -m "Automated update from GitHub Actions with Production test changes"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"