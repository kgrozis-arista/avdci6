---
# Build playbook - Generate AVD configurations for the fabric
# This playbook runs the eos_designs and eos_cli_config_gen roles
# to generate structured configs and device CLI configurations

- name: Build fabric configurations with AVD
  hosts: FABRIC
  connection: local
  gather_facts: false
  vars:
    output_base_dir: "{{ playbook_dir | dirname }}/AVD-information"
  tasks:
    - name: Display banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║               Building AVD Fabric Configurations               ║
          ║                      eos_designs role                          ║
          ╚════════════════════════════════════════════════════════════════╝

    - name: Clean existing outputs and recreate directories
      ansible.builtin.shell: |
        rm -rf {{ output_base_dir }}/configs {{ output_base_dir }}/structured_configs
        mkdir -p {{ output_base_dir }}/configs {{ output_base_dir }}/structured_configs
      run_once: true
      changed_when: true

    - name: Run eos_designs role to generate structured configs
      ansible.builtin.import_role:
        name: arista.avd.eos_designs
      vars:
        eos_designs_structured_config_dir: "{{ output_base_dir }}/structured_configs"

    - name: Run eos_cli_config_gen role to render device CLI configs
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen
      vars:
        eos_cli_config_gen_config_dir: "{{ output_base_dir }}/configs"
        eos_cli_config_gen_defs_dir: "{{ output_base_dir }}/structured_configs"

    - name: Verify normal AVD configs were generated (not reset configs)
      ansible.builtin.shell: |
        if grep -q "Reset Configuration" {{ output_base_dir }}/configs/{{ inventory_hostname }}.cfg 2>/dev/null; then
          echo "ERROR: Reset config found instead of normal AVD config!"
          exit 1
        fi
      changed_when: false

    - name: Display completion banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║                  Build Complete ✓                              ║
          ║                                                                ║
          ║  Outputs available in: AVD-information/                        ║
          ║  - configs/            (EOS device configurations)            ║
          ║  - structured_configs/ (Data models in YAML)                  ║
          ║  - documentation/      (Fabric topology and reports)          ║
          ╚════════════════════════════════════════════════════════════════╝
