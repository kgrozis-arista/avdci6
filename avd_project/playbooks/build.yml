---
# Build playbook - Generate AVD configurations for the fabric
# This playbook runs the eos_designs and eos_cli_config_gen roles
# to generate structured configs and device CLI configurations

- name: Build fabric configurations with AVD
  hosts: FABRIC
  connection: local
  gather_facts: false
  tasks:
    - name: Display banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║               Building AVD Fabric Configurations               ║
          ║                      eos_designs role                          ║
          ╚════════════════════════════════════════════════════════════════╝

    - name: Debug - Show output directory path  # noqa: run-once[task]
      ansible.builtin.debug:
        msg: |
          Output Directory Path (from group_vars):
            - root_dir: {{ inventory_dir }}/..
            - output_dir: {{ output_dir }}/configs
            # - configs_dir: {{ configs_dir }}
            # - structured_configs_dir: {{ output_dir }}/structured_configs
            # - documentation_dir: {{ output_dir }}/documentation
            - Resolved output_dir: {{ output_dir | realpath }}
      run_once: true  # noqa: run-once[task]

    # - name: Clean existing outputs and recreate directories  # noqa: run-once[task]
    #   ansible.builtin.shell: |
    #     rm -rf {{ configs_dir }} {{ structured_configs_dir }} {{ documentation_dir }}
    #     mkdir -p {{ configs_dir }} {{ structured_configs_dir }} {{ documentation_dir }}
    #   run_once: true  # noqa: run-once[task]
    #   changed_when: true

    - name: Run eos_designs role to generate structured configs
      ansible.builtin.import_role:
        name: arista.avd.eos_designs

    - name: Run eos_cli_config_gen role to render device CLI configs
      ansible.builtin.import_role:
        name: arista.avd.eos_cli_config_gen

    # - name: Verify normal AVD configs were generated (not reset configs)
    #   ansible.builtin.shell: |
    #     if grep -q "Reset Configuration" {{ configs_dir }}/{{ inventory_hostname }}.cfg 2>/dev/null; then
    #       echo "ERROR: Reset config found instead of normal AVD config!"
    #       exit 1
    #     fi
    #   changed_when: false

    - name: Display completion banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║                  Build Complete ✓                              ║
          ║                                                                ║
          ║  Outputs available in: AVD-information/                        ║
          ║  - configs/            (EOS device configurations)            ║
          ║  - structured_configs/ (Data models in YAML)                  ║
          ║  - documentation/      (Fabric topology and reports)          ║
          ╚════════════════════════════════════════════════════════════════╝
