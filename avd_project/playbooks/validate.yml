---
# Validate playbook - Run ANTA tests to validate fabric state
# This playbook uses the anta_runner role to execute automated tests

- name: Validate fabric state with ANTA tests
  hosts: FABRIC
  connection: local
  gather_facts: false
  tasks:
    - name: Display banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║          Validating Fabric State with ANTA Tests               ║
          ║                     anta_runner role                           ║
          ╚════════════════════════════════════════════════════════════════╝

    - name: Run ANTA validation tests
      ansible.builtin.import_role:
        name: arista.avd.anta_runner
      vars:
        anta_report_expand_results: true
        anta_catalogs_filters:
          - skip_tests:
              - VerifyNTP
              - VerifyReloadCause
              - VerifyLoggingErrors
      failed_when: anta_tests_summary.tests_error > 0

    - name: Display completion banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║            Validation Complete ✓                               ║
          ║                                                                ║
          ║  Test reports available in: intended/reports/                ║
          ║  - ANTA test results (Markdown)                              ║
          ║  - Device validation status                                  ║
          ╚════════════════════════════════════════════════════════════════╝
