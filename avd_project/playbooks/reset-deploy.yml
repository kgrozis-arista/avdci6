---
# Reset Deploy Playbook - Deploy reset configurations to all topology devices
# This playbook pushes reset baseline configs to fabric spines, leaves, and hosts via CloudVision

- name: Deploy reset configurations to fabric
  hosts: FABRIC
  connection: local
  gather_facts: false
  vars:
    output_dir: "{{ inventory_dir }}/intended"
    eos_config_dir: "{{ output_dir }}/configs"
    reset_configs_dir: "{{ output_dir }}/reset-configs"
    cv_inventory_hostname: cv_dev_server

  pre_tasks:
    - name: Display banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║          Deploying Reset Configurations                        ║
          ║       WARNING: Restoring devices to baseline state             ║
          ║                                                                ║
          ║  This will remove all AVD configurations!                      ║
          ║  Devices will return to factory/startup state.                ║
          ╚════════════════════════════════════════════════════════════════╝
      delegate_to: localhost
      run_once: true

  tasks:
    - name: Deploy reset configuration to CloudVision
      ansible.builtin.import_role:
        name: arista.avd.cv_deploy
      environment:
        PYTHONWARNINGS: "ignore:Unverified HTTPS request"
      vars:
        cv_inventory_hostname: cv_dev_server
        cv_verify_certs: false
        cv_verify_devices_exist: false
        cv_run_change_control: false
        cv_register_detailed_results: true
        cv_workspace_description: |
          Reset {{ inventory_hostname }} from {{ lookup('env', 'USER') }}
          on {{ ansible_date_time.iso8601 | default('') }}
        cv_server: "{{ hostvars[cv_inventory_hostname].ansible_user }}"
        cv_token: "{{ hostvars[cv_inventory_hostname].ansible_password }}"
        cv_device_configs:
          - device_name: "{{ inventory_hostname }}"
            config: "{{ lookup('file', reset_configs_dir + '/' + inventory_hostname + '.cfg') }}"

  post_tasks:
    - name: Display completion banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║              Reset Deployment Complete ✓                       ║
          ║                                                                ║
          ║  All fabric devices have been reset to baseline state.        ║
          ║                                                                ║
          ║  Next steps:                                                   ║
          ║  1. Verify device connectivity: ping <mgmt_ip>               ║
          ║  2. Regenerate AVD configs: make build                         ║
          ║  3. Redeploy to devices: make deploy                          ║
          ╚════════════════════════════════════════════════════════════════╝
      run_once: true

- name: Generate reset configurations for hosts (local only)
  hosts: HOSTS
  connection: local
  gather_facts: false
  vars:
    output_dir: "{{ inventory_dir }}/intended"
    reset_output_dir: "{{ output_dir }}/reset-configs"

  tasks:
    - name: Note about host reset configs
      ansible.builtin.debug:
        msg: |
          Reset configurations have been generated for:
          - {{ inventory_hostname }}

          Note: Hosts are not deployed via CloudVision as they are
          simulated endpoints. Reset configs are available at:
          intended/reset-configs/{{ inventory_hostname }}.cfg

          If you need to reset actual host devices, deploy configs manually
          via EOS eAPI or management interface.
