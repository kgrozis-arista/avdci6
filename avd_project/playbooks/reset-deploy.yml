---
# Reset Deploy Playbook - Deploy reset configurations to all topology devices
# This playbook pushes reset baseline configs to fabric spines, leaves, and hosts

- name: Deploy reset configurations to fabric
  hosts: FABRIC
  connection: ansible.netcommon.httpapi
  gather_facts: false
  vars:
    reset_output_dir: "{{ playbook_dir | dirname }}/AVD-information/reset-configs"

  pre_tasks:
    - name: Display banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║          Deploying Reset Configurations                        ║
          ║       WARNING: Restoring devices to baseline state             ║
          ║                                                                ║
          ║  This will remove all AVD configurations!                      ║
          ║  Devices will return to factory/startup state.                ║
          ╚════════════════════════════════════════════════════════════════╝
      run_once: true

  tasks:
    - name: Load reset configuration
      ansible.builtin.slurp:
        src: "{{ reset_output_dir }}/{{ inventory_hostname }}.cfg"
      register: reset_config

    - name: Deploy reset configuration to device
      arista.eos.eos_command:
        commands:
          - "configure replace flash:startup-config force"
          - "copy running-config startup-config"
      ignore_errors: true
      register: deploy_result

    - name: Verify reset deployment
      arista.eos.eos_facts:
        gather_subset: hardware
      register: device_facts
      retries: 3
      delay: 5

  post_tasks:
    - name: Display completion banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║              Reset Deployment Complete ✓                       ║
          ║                                                                ║
          ║  All fabric devices have been reset to baseline state.        ║
          ║                                                                ║
          ║  Next steps:                                                   ║
          ║  1. Verify device connectivity: ping <mgmt_ip>               ║
          ║  2. Regenerate AVD configs: make build                         ║
          ║  3. Redeploy to devices: make deploy                          ║
          ╚════════════════════════════════════════════════════════════════╝
      run_once: true

- name: Deploy reset configurations to hosts
  hosts: HOSTS
  connection: ansible.netcommon.httpapi
  gather_facts: false
  vars:
    reset_output_dir: "{{ playbook_dir | dirname }}/AVD-information/reset-configs"

  tasks:
    - name: Load reset configuration
      ansible.builtin.slurp:
        src: "{{ reset_output_dir }}/{{ inventory_hostname }}.cfg"
      register: reset_config

    - name: Deploy reset configuration to host
      arista.eos.eos_command:
        commands:
          - "configure replace flash:startup-config force"
          - "copy running-config startup-config"
      ignore_errors: true
      register: deploy_result
