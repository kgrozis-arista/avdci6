---
# Deploy playbook - Push configurations to CloudVision and devices
# This playbook uses the eos_config_deploy role to stage configs in CVP

- name: Deploy fabric configurations to CloudVision
  hosts: FABRIC
  connection: local
  gather_facts: false
  vars:
    cv_inventory_hostname: "{{ cloudvision_host | default('cv_dev_server') }}"
  tasks:
    - name: Display banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║            Deploying AVD Configurations to CVP                 ║
          ║                    eos_config_deploy role                      ║
          ╚════════════════════════════════════════════════════════════════╝
      delegate_to: localhost

    - name: Debug - Show config directory path (what cv_deploy role uses)
      ansible.builtin.debug:
        msg: |
          Config Directory Path:
            - output_dir (used by cv_deploy): {{ output_dir }}
            - Resolved path: {{ output_dir | realpath }}/configs/
            - Playbook dir: {{ playbook_dir }}
            - Working dir: {{ lookup('pipe', 'pwd') }}
      delegate_to: localhost
      run_once: true

    - name: Deploy configurations and tags to CloudVision
      ansible.builtin.import_role:
        name: arista.avd.cv_deploy
      vars:
        cv_verify_certs: false
        cv_run_change_control: "{{ 'dev' in (cloudvision_host | default('cv_dev_server')) }}"
        cv_register_detailed_results: true
        cv_workspace_description: |
          AVD deploy DC1 from {{ lookup('env', 'USER') }}
          on {{ ansible_date_time.iso8601 | default('') }}
        cv_server: "{{ hostvars[cv_inventory_hostname].ansible_user }}"
        cv_token: "{{ hostvars[cv_inventory_hostname].ansible_password }}"

    - name: Display completion banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║              Deployment Complete ✓                             ║
          ║                                                                ║
          ║  Configurations have been staged in CloudVision.              ║
          ║  Review and approve change controls in the CVP UI.            ║
          ╚════════════════════════════════════════════════════════════════╝
