---
# Playbook: NetBox 4.6.8 Automated Deployment for Ubuntu
- name: Gather NetBox configuration from user
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    netbox_version: "4.6.8"
    netbox_user: "unit"
    netbox_email: "kgrozis@arista.com"
    netbox_passwd: "arista"

  tasks:
  # ========================================================================
    # Interactive Configuration
    # ========================================================================
    - name: Display current NetBox configuration
      ansible.builtin.debug:
        msg:
          - "NetBox Configuration"
          - "===================="
          - "Current NetBox superuser: {{ netbox_user }}"
          - "Current NetBox email: {{ netbox_email }}"
          - "Current NetBox version: {{ netbox_version }}"

    - name: Prompt to change NetBox superuser
      ansible.builtin.pause:
        prompt: "Change NetBox superuser from '{{ netbox_user }}' to a different value? (yes/no)"
      register: change_user_prompt

    - name: Prompt for new NetBox superuser
      ansible.builtin.pause:
        prompt: "Enter new NetBox superuser name"
      register: new_netbox_user
      when: change_user_prompt.user_input | lower in ['yes', 'y']

    - name: Update NetBox user if changed
      ansible.builtin.set_fact:
        netbox_user: "{{ new_netbox_user.user_input }}"
      when: change_user_prompt.user_input | lower in ['yes', 'y']

    - name: Prompt to change NetBox email
      ansible.builtin.pause:
        prompt: "Change NetBox email from '{{ netbox_email }}' to a different value? (yes/no)"
      register: change_email_prompt

    - name: Prompt for new NetBox email
      ansible.builtin.pause:
        prompt: "Enter new NetBox email address"
      register: new_netbox_email
      when: change_email_prompt.user_input | lower in ['yes', 'y']

    - name: Update NetBox email if changed
      ansible.builtin.set_fact:
        netbox_email: "{{ new_netbox_email.user_input }}"
      when: change_email_prompt.user_input | lower in ['yes', 'y']

    # ========================================================================
    # NetBox Password Configuration
    # ========================================================================
    - name: Check if NetBox password file exists
      stat:
        path: "{{ lookup('env','HOME') }}/NETBOX_PASS"
      register: netbox_pass_file

    - name: Read current NetBox password from file
      slurp:
        src: "{{ lookup('env','HOME') }}/NETBOX_PASS"
      register: netbox_pass_content
      when: netbox_pass_file.stat.exists

    - name: Set current password from file
      ansible.builtin.set_fact:
        current_netbox_passwd: "{{ netbox_pass_content.content | b64decode | trim }}"
      when: netbox_pass_file.stat.exists

    - name: Set default password if file doesn't exist
      ansible.builtin.set_fact:
        current_netbox_passwd: "{{ netbox_passwd }}"
      when: not netbox_pass_file.stat.exists

    - name: Display current NetBox password status
      ansible.builtin.debug:
        msg:
          - "NetBox Password File: {{ lookup('env','HOME') }}/NETBOX_PASS"
          - "Status: {% if netbox_pass_file.stat.exists %}EXISTS{% else %}NOT FOUND (will use default: {{ netbox_passwd }}){% endif %}"

    - name: Prompt to change NetBox password
      ansible.builtin.pause:
        prompt: "Change NetBox superuser password? (yes/no)"
      register: change_pass_prompt

    - name: Prompt for new NetBox password
      ansible.builtin.pause:
        prompt: "Enter new NetBox superuser password"
        echo: no
      register: new_netbox_pass
      when: change_pass_prompt.user_input | lower in ['yes', 'y']

    - name: Update NetBox password variable
      ansible.builtin.set_fact:
        netbox_passwd: "{{ new_netbox_pass.user_input }}"
      when: change_pass_prompt.user_input | lower in ['yes', 'y']

    - name: Create or update NetBox password file
      ansible.builtin.copy:
        content: "{{ netbox_passwd }}"
        dest: "{{ lookup('env','HOME') }}/NETBOX_PASS"
        mode: '0600'
      when: change_pass_prompt.user_input | lower in ['yes', 'y']

    - name: Display final configuration
      ansible.builtin.debug:
        msg:
          - "✓ Configuration confirmed"
          - ""
          - "NetBox Superuser: {{ netbox_user }}"
          - "NetBox Email: {{ netbox_email }}"
          - "NetBox Version: {{ netbox_version }}"
          - "NetBox Password File: {{ lookup('env','HOME') }}/NETBOX_PASS"
          - ""
          - "Starting NetBox {{ netbox_version }} installation..."

    - name: Export variables for remote play
      ansible.builtin.set_fact:
        final_netbox_user: "{{ new_netbox_user.user_input if (change_user_prompt.user_input | default('') | lower in ['yes', 'y']) else netbox_user }}"
        final_netbox_email: "{{ netbox_email }}"
        final_netbox_passwd: "{{ netbox_passwd }}"
        final_netbox_version: "{{ netbox_version }}"

- name: Install and Configure NetBox on Target Server
  hosts: netbox
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    netbox_version: "{{ hostvars['localhost']['final_netbox_version'] }}"
    netbox_user: "{{ hostvars['localhost']['final_netbox_user'] }}"
    netbox_email: "{{ hostvars['localhost']['final_netbox_email'] }}"
    netbox_passwd: "{{ hostvars['localhost']['final_netbox_passwd'] }}"
    db_password: "J5brHrAXFLQSif0K"

  tasks:
    - name: Install repository prerequisites
      ansible.builtin.apt:
        pkg:
          - software-properties-common
          - gpg-agent
        state: present
        update_cache: true

    - name: Add Deadsnakes PPA for Python 3.12
      ansible.builtin.apt_repository:
        repo: ppa:deadsnakes/ppa
        state: present

    - name: Install system dependencies and Python 3.12
      ansible.builtin.apt:
        pkg:
          - python3
          - python3-pip
          - python3-psycopg2
          - python3.12
          - python3.12-venv
          - python3.12-dev
          - postgresql
          - postgresql-contrib
          - redis-server
          - build-essential
          - libxml2-dev
          - libxslt1-dev
          - libffi-dev
          - libpq-dev
          - libssl-dev
          - zlib1g-dev
          - git
        state: present
        update_cache: true

    - name: Create PostgreSQL database
      community.postgresql.postgresql_db:
        name: netbox
      become_user: postgres

    - name: Create PostgreSQL user
      community.postgresql.postgresql_user:
        name: netbox
        password: "{{ db_password }}"
      become_user: postgres

    - name: Grant database ownership
      community.postgresql.postgresql_owner:
        db: netbox
        new_owner: netbox
      become_user: postgres

    - name: Create netbox group
      ansible.builtin.group:
        name: netbox
        system: true

    - name: Create netbox user
      ansible.builtin.user:
        name: netbox
        shell: /bin/bash
        group: netbox
        system: true
        home: /opt/netbox

    - name: Download and unpack NetBox source
      ansible.builtin.unarchive:
        src: "https://github.com/netbox-community/netbox/archive/refs/tags/v{{ netbox_version }}.tar.gz"
        dest: /opt
        remote_src: true

    - name: Ensure symbolic link /opt/netbox points to source release
      ansible.builtin.file:
        src: "/opt/netbox-{{ netbox_version }}"
        dest: /opt/netbox
        state: link

    - name: Set permissions on NetBox release path
      ansible.builtin.file:
        path: "/opt/netbox-{{ netbox_version }}"
        owner: netbox
        group: netbox
        recurse: true

    - name: Generate NetBox configuration.py
      ansible.builtin.copy:
        dest: /opt/netbox/netbox/netbox/configuration.py
        owner: netbox
        group: netbox
        mode: '0640'
        content: |
          ALLOWED_HOSTS = ['*']
          DATABASE = {
              'NAME': 'netbox',
              'USER': 'netbox',
              'PASSWORD': '{{ db_password }}',
              'HOST': 'localhost',
              'PORT': '',
              'CONN_MAX_AGE': 300,
          }
          REDIS = {
              'tasks': {
                  'HOST': 'localhost',
                  'PORT': 6379,
                  'PASSWORD': '',
                  'DATABASE': 0,
                  'DEFAULT_TIMEOUT': 300,
              },
              'caching': {
                  'HOST': 'localhost',
                  'PORT': 6379,
                  'PASSWORD': '',
                  'DATABASE': 1,
                  'DEFAULT_TIMEOUT': 300,
              }
          }
          SECRET_KEY = 'd3m0s3cr3tk3yh3r3_ch2ng3_th1s_in_pr0duct10n_1234567890_secure'
          API_TOKEN_PEPPERS = {
              1: 'p3pp3rk3y1234567890_ch2ng3_th1s_in_pr0duct10n_at_least_50_chars'
          }

    - name: Run NetBox official upgrade script using Python 3.12
      ansible.builtin.command: /opt/netbox/upgrade.sh
      environment:
        PYTHON: /usr/bin/python3.12

    - name: Copy Gunicorn configuration
      ansible.builtin.copy:
        src: /opt/netbox/contrib/gunicorn.py
        dest: /opt/netbox/gunicorn.py
        remote_src: true

    - name: Copy systemd service unit files
      ansible.builtin.copy:
        src: "/opt/netbox/contrib/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        remote_src: true
      loop:
        - netbox.service
        - netbox-rq.service

    - name: Enable and start NetBox services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - netbox
        - netbox-rq

    # ========================================================================
    # Nginx Reverse Proxy Configuration (Port 80)
    # ========================================================================
    - name: Install nginx web server
      ansible.builtin.apt:
        pkg:
          - nginx
        state: present
        update_cache: yes
      become: true
      become_method: sudo

    - name: Create nginx configuration for NetBox reverse proxy
      ansible.builtin.copy:
        content: |
          upstream netbox {
              server 127.0.0.1:8001;
          }

          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              client_max_body_size 25m;

              location / {
                  proxy_pass http://netbox;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /static/ {
                  alias /opt/netbox/netbox/static/;
              }
          }
        dest: /etc/nginx/sites-available/netbox
      become: true
      become_method: sudo

    - name: Enable nginx netbox site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/netbox
        dest: /etc/nginx/sites-enabled/netbox
        state: link
      become: true
      become_method: sudo

    - name: Disable default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      become: true
      become_method: sudo

    - name: Test nginx configuration
      ansible.builtin.shell: nginx -t
      become: true
      become_method: sudo
      register: nginx_test

    - name: Enable and start nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        enabled: true
        daemon_reload: true
      become: true
      become_method: sudo

    - name: Reload nginx to apply netbox configuration
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
      become: true
      become_method: sudo

    - name: Create administrative superuser non-interactively
      ansible.builtin.shell: |
        /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py shell -c "
        from django.contrib.auth import get_user_model;
        User = get_user_model();
        User.objects.filter(username='{{ netbox_user }}').exists() or User.objects.create_superuser('{{ netbox_user }}', '{{ netbox_email }}', '{{ netbox_passwd }}')
        "

- name: Verify NetBox 4.6.8 Installation
  hosts: netbox
  become: true
  tags:
    - netbox-verify
  gather_facts: true

  tasks:
    - name: Check NetBox service is running
      ansible.builtin.systemd_service:
        name: netbox
      register: netbox_service_status

    - name: Check NetBox background worker service is running
      ansible.builtin.systemd_service:
        name: netbox-rq
      register: netbox_rq_service_status

    - name: Check nginx reverse proxy service is running
      ansible.builtin.systemd_service:
        name: nginx
      register: nginx_service_status

    - name: Wait for NetBox to be ready on port 80
      ansible.builtin.wait_for:
        host: "{{ ansible_facts['default_ipv4']['address'] }}"
        port: 80
        delay: 5
        timeout: 60
      when: netbox_service_status.status.ActiveState == "active"
      ignore_errors: yes
      register: netbox_port_wait

    - name: Verify listening ports
      ansible.builtin.shell: ss -tlnp 2>/dev/null | grep -E '80|8000' || netstat -tlnp 2>/dev/null | grep -E '80|8000' || echo "Port check completed"
      register: listening_ports
      ignore_errors: yes

    - name: Check if gunicorn process is running
      ansible.builtin.shell: pgrep -f "gunicorn.*netbox" | wc -l
      register: gunicorn_process_count
      ignore_errors: yes

    - name: Check NetBox application health (via nginx on port 80)
      ansible.builtin.shell: |
        curl -s -o /dev/null -w "%{http_code}" http://localhost/ 2>/dev/null || echo "Connection failed"
      register: netbox_health_check
      ignore_errors: yes
      environment:
        PYTHONUNBUFFERED: 1

    - name: Get NetBox service logs (last 10 lines)
      ansible.builtin.shell: journalctl -u netbox -n 10 --no-pager
      register: netbox_logs
      ignore_errors: yes

    - name: Get NetBox worker logs (last 10 lines)
      ansible.builtin.shell: journalctl -u netbox-rq -n 10 --no-pager
      register: netbox_rq_logs
      ignore_errors: yes

    - name: Display NetBox verification results
      ansible.builtin.debug:
        msg:
          - "NetBox 4.6.8 Installation Verification"
          - "======================================"
          - ""
          - "Service Status:"
          - "  NetBox UI Service (gunicorn): {{ netbox_service_status.status.ActiveState }}"
          - "  NetBox Worker Service (RQ): {{ netbox_rq_service_status.status.ActiveState }}"
          - "  Nginx Reverse Proxy: {{ nginx_service_status.status.ActiveState }}"
          - "  Gunicorn Processes Running: {{ gunicorn_process_count.stdout }}"
          - ""
          - "Port Status:"
          - "{{ listening_ports.stdout_lines if listening_ports.stdout_lines else ['No ports found or netstat/ss unavailable'] }}"
          - ""
          - "Port Readiness:"
          - "  Port 80 (HTTP via Nginx): {{ 'YES' if not netbox_port_wait.failed else 'NO (still starting or error)' }}"
          - ""
          - "Application Health:"
          - "  HTTP Status Code: {{ netbox_health_check.stdout }}"
          - ""
          - "Recent Service Logs:"
          - "  NetBox Service (Gunicorn):"
          - "{{ netbox_logs.stdout_lines | default(['No logs available']) | map('regex_replace', '^', '    ') | list }}"
          - ""
          - "  NetBox Worker Service (RQ):"
          - "{{ netbox_rq_logs.stdout_lines | default(['No logs available']) | map('regex_replace', '^', '    ') | list }}"
          - ""
          - "NetBox Access Information:"
          - "  URL: http://{{ ansible_facts['default_ipv4']['address'] }}"
          - "  Port: 80 (HTTP)"
          - "  Username: {{ hostvars['localhost']['final_netbox_user'] if 'localhost' in groups else 'unit' }}"
          - "  Password: [configured during setup]"
          - ""
          - "Next Steps:"
          - "  1. Open http://{{ ansible_facts['default_ipv4']['address'] }} in your browser"
          - "  2. Login with configured credentials"
          - "  3. Navigate to Admin → API Tokens to create automation tokens"
          - "  4. Configure NetBox inventory for fabric devices"

    - name: Read NetBox configuration file
      ansible.builtin.slurp:
        src: /opt/netbox/netbox/netbox/configuration.py
      register: netbox_config
      ignore_errors: yes

    - name: Display NetBox component status summary
      ansible.builtin.debug:
        msg:
          - ""
          - "NetBox Component Summary"
          - "========================"
          - "Installation Status: COMPLETE"
          - "NetBox Version: 4.6.8"
          - "Python Interpreter: /opt/netbox/venv/bin/python"
          - "Web Server: Nginx (Reverse Proxy)"
          - "Public Port: 80 (HTTP)"
          - "Backend Port: 8001 (Gunicorn)"
          - "Database: PostgreSQL (netbox user)"
          - "Cache Backend: Redis"
          - "Background Worker: Enabled (RQ)"
          - ""
          - "Service Component Status:"
          - "  Public Access: http://{{ ansible_facts['default_ipv4']['address'] }}"
          - "  Nginx Reverse Proxy: {{ nginx_service_status.status.ActiveState }} (port 80)"
          - "  Gunicorn Application: {{ netbox_service_status.status.ActiveState }} (port 8000, internal only)"
          - "  Gunicorn Workers Running: {{ gunicorn_process_count.stdout }}"
          - "  RQ Background Worker: {{ netbox_rq_service_status.status.ActiveState }}"
          - "  PostgreSQL Database: port 5432"
          - "  Redis Cache: port 6379"
          - ""
          - "Configuration Files:"
          - "  Nginx Config: /etc/nginx/sites-available/netbox"
          - "  NetBox Config: /opt/netbox/netbox/netbox/configuration.py"
          - "  Gunicorn Service: /etc/systemd/system/netbox.service"
          - "  RQ Worker Service: /etc/systemd/system/netbox-rq.service"
          - ""
          - "Troubleshooting (if port 80 is not responding):"
          - "  1. Check all services: systemctl status netbox netbox-rq nginx"
          - "  2. View Nginx logs: journalctl -u nginx -n 50"
          - "  3. View NetBox logs: journalctl -u netbox -n 50"
          - "  4. View Worker logs: journalctl -u netbox-rq -n 50"
          - "  5. Test Nginx config: nginx -t"
          - "  6. Check NetBox app logs: tail -f /opt/netbox/venv/lib/python3.12/site-packages/netbox.log"
          - "  7. Verify PostgreSQL: sudo -u postgres psql -l | grep netbox"
          - "  8. Verify Redis: redis-cli ping (should return PONG)"
          - "  9. Restart all services: systemctl restart nginx netbox netbox-rq"
          - "  10. Wait 10-30 seconds for services to fully start, then re-run: make netbox-verify"
