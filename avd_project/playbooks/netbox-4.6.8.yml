        - { device: "DC1-LEAF1B", interface: "Ethernet2" }
        - { device: "DC1-LEAF1B", interface: "Ethernet3" }
        - { device: "DC1-LEAF1B", interface: "Ethernet49" }
        - { device: "DC1-LEAF1B", interface: "Ethernet50" }
        - { device: "DC1-LEAF1B", interface: "Ethernet51" }
        - { device: "DC1-LEAF2A", interface: "Ethernet1" }
        - { device: "DC1-LEAF2A", interface: "Ethernet2" }
        - { device: "DC1-LEAF2A", interface: "Ethernet3" }
