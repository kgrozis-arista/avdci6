    - name: Create MLAG Cables - DC1
      netbox.netbox.netbox_cable:
        netbox_url: "{{ netbox_url }}"
        netbox_token: "{{ netbox_token }}"
        data:
          termination_a_type: dcim.interface
          termination_a:
            device: "{{ item.a_device }}"
            name: "{{ item.a_interface }}"
          termination_b_type: dcim.interface
          termination_b:
            device: "{{ item.b_device }}"
            name: "{{ item.b_interface }}"
          type: cat6
          status: connected
        state: present
      loop:
        - { a_device: "DC1-LEAF1A", a_interface: "Ethernet49", b_device: "DC1-LEAF1B", b_interface: "Ethernet49" }
