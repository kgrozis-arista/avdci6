---
# Reset Build Playbook - Generate reset configurations for all topology devices
# This playbook generates baseline reset configs for spines, leaves, and hosts

- name: Build reset configurations for fabric
  hosts: FABRIC
  connection: local
  gather_facts: false
  vars:
    reset_output_dir: "{{ playbook_dir | dirname }}/AVD-information/reset-configs"
  pre_tasks:
    - name: Display banner and create output directory  # noqa: key-order[task]
      block:
        - name: Display banner
          ansible.builtin.debug:
            msg: |
              ╔════════════════════════════════════════════════════════════════╗
              ║          Building Reset Configurations                          ║
              ║       Restoring Fabric to Baseline State                       ║
              ╚════════════════════════════════════════════════════════════════╝
        - name: Debug - Show reset output directory path
          ansible.builtin.debug:
            msg: |
              Reset Output Directory Path:
                - reset_output_dir: {{ reset_output_dir }}
                - Resolved path: {{ reset_output_dir | realpath }}
                - Playbook dir: {{ playbook_dir }}
                - Working dir: {{ lookup('pipe', 'pwd') }}
        - name: Create reset config output directory
          ansible.builtin.file:
            path: "{{ reset_output_dir }}"
            state: directory
            mode: '0755'
      run_once: true  # noqa: run-once[task]
  tasks:
    - name: Generate reset configuration from template  # noqa: key-order[task]
      ansible.builtin.template:
        src: reset-config.j2
        dest: "{{ reset_output_dir }}/{{ inventory_hostname }}.cfg"
        mode: '0644'
      vars:
        device_name: "{{ inventory_hostname }}"
        device_mgmt_ip: "{{ ansible_host }}"
  post_tasks:
    - name: Display completion banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║              Reset Configs Generated ✓                         ║
          ║                                                                ║
          ║  Reset configurations available in:                           ║
          ║  AVD-information/reset-configs/                                ║
          ║                                                                ║
          ║  Next: Deploy reset configs with 'make reset-deploy'         ║
          ╚════════════════════════════════════════════════════════════════╝
      delegate_to: localhost
      run_once: true  # noqa: run-once[task]

- name: Build reset configurations for hosts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    reset_output_dir: "{{ playbook_dir | dirname }}/AVD-information/reset-configs"
    host_list:
      - DC1-HOST1
      - DC1-HOST2
      - DC2-HOST1
      - DC2-HOST2
    host_mgmt_ips:
      DC1-HOST1: 192.168.0.30
      DC1-HOST2: 192.168.0.31
      DC2-HOST1: 192.168.0.32
      DC2-HOST2: 192.168.0.33
  pre_tasks:
    - name: Ensure reset-configs directory exists
      ansible.builtin.file:
        path: "{{ reset_output_dir }}"
        state: directory
        mode: '0755'
    - name: Debug - Show reset output directory path
      ansible.builtin.debug:
        msg: |
          Reset Output Directory Path:
            - reset_output_dir: {{ reset_output_dir }}
            - Resolved path: {{ reset_output_dir | realpath }}
            - Playbook dir: {{ playbook_dir }}
            - Working dir: {{ lookup('pipe', 'pwd') }}
  tasks:
    - name: Generate reset configuration from template for hosts
      ansible.builtin.template:
        src: reset-config.j2
        dest: "{{ reset_output_dir }}/{{ item }}.cfg"
        mode: '0644'
      loop: "{{ host_list }}"
      vars:
        device_name: "{{ item }}"
        device_mgmt_ip: "{{ host_mgmt_ips[item] }}"
