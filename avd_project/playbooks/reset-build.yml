---
# Reset Build Playbook - Generate reset configurations for all topology devices
# This playbook generates baseline reset configs for spines, leaves, and hosts

- name: Build reset configurations for fabric
  hosts: FABRIC
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Display banner and create output directory  # noqa: key-order[task]
      block:
        - name: Display banner
          ansible.builtin.debug:
            msg: |
              ╔════════════════════════════════════════════════════════════════╗
              ║          Building Reset Configurations                          ║
              ║       Restoring Fabric to Baseline State                       ║
              ╚════════════════════════════════════════════════════════════════╝
        - name: Create temporary reset config output directory
          ansible.builtin.file:
            path: "{{ playbook_dir | dirname }}/AVD-information/tmp_reset_configs"
            state: directory
            mode: '0755'
      run_once: true  # noqa: run-once[task]
  tasks:
    - name: Generate reset configuration from template  # noqa: key-order[task]
      ansible.builtin.template:
        src: reset-config.j2
        dest: "{{ playbook_dir | dirname }}/AVD-information/tmp_reset_configs/{{ inventory_hostname }}.cfg"
        mode: '0644'
      vars:
        device_name: "{{ inventory_hostname }}"
        device_mgmt_ip: "{{ ansible_host }}"
  post_tasks:
    - name: Display completion banner
      ansible.builtin.debug:
        msg: |
          ╔════════════════════════════════════════════════════════════════╗
          ║              Reset Configs Generated ✓                         ║
          ║                                                                ║
          ║  Reset configurations staged in temporary location:           ║
          ║  AVD-information/tmp_reset_configs/                            ║
          ║                                                                ║
          ║  Next: Deploy reset configs with 'make reset-deploy'         ║
          ║  (Will be copied to configs/ for deployment)                  ║
          ╚════════════════════════════════════════════════════════════════╝
      delegate_to: localhost
      run_once: true  # noqa: run-once[task]

- name: Build reset configurations for hosts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    host_list:
      - DC1-HOST1
      - DC1-HOST2
      - DC2-HOST1
      - DC2-HOST2
    host_mgmt_ips:
      DC1-HOST1: 192.168.0.30
      DC1-HOST2: 192.168.0.31
      DC2-HOST1: 192.168.0.32
      DC2-HOST2: 192.168.0.33
  pre_tasks:
    - name: Ensure temporary reset-configs directory exists
      ansible.builtin.file:
        path: "{{ playbook_dir | dirname }}/AVD-information/tmp_reset_configs"
        state: directory
        mode: '0755'
  tasks:
    - name: Generate reset configuration from template for hosts
      ansible.builtin.template:
        src: reset-config.j2
        dest: "{{ playbook_dir | dirname }}/AVD-information/tmp_reset_configs/{{ item }}.cfg"
        mode: '0644'
      loop: "{{ host_list }}"
      vars:
        device_name: "{{ item }}"
        device_mgmt_ip: "{{ host_mgmt_ips[item] }}"
