---
all:
  vars:
    ansible_user: cvpadmin
    ansible_password: cvp123!

  children:
    # CVP management
    CVP:
      vars:
        ansible_become: true
        ansible_become_method: enable
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: false
        ansible_network_os: eos
        ansible_httpapi_port: 443
        ansible_connection: httpapi
        ansible_python_interpreter: $(which python3)
      hosts:
        cv_dev_server:
          ansible_httpapi_host: 10.18.157.189
          ansible_host: 10.18.157.189
          ansible_user: 10.18.157.189
          # yamllint disable-line rule:line-length
          ansible_password: "{{ lookup('file', lookup('env', 'HOME') + '/DEV_AVDCI6_TOKEN') }}"

    # AVD Tooling server for remote automation
    AVD_TOOLING:
      vars:
        ansible_user: ansible
        ansible_password: ansible
        ansible_become: true
        ansible_become_method: sudo
        ansible_become_password: ansible
      hosts:
        avd:
          ansible_host: 10.18.157.188

    # NetBox for inventory management
    NETBOX:
      vars:
        ansible_user: ansible
        ansible_password: ansible
        ansible_become: true
        ansible_become_method: sudo
        ansible_become_password: ansible
      hosts:
        netbox:
          ansible_host: 192.168.0.7

    # Fabric - top-level fabric group containing all DCs
    FABRIC:
      vars:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: arista.eos.eos
        ansible_user: cvpadmin
        ansible_password: cvp123!
        ansible_become: true
        ansible_become_method: enable
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: false
      children:
        DC1:
        DC2:

    # DC1 - First datacenter with spine/leaf fabric nodes
    DC1:
      children:
        DC1_SPINES:
          hosts:
            DC1-SPINE1:
              ansible_host: 192.168.0.10
            DC1-SPINE2:
              ansible_host: 192.168.0.11
            DC1-SPINE3:
              ansible_host: 192.168.0.12
        DC1_LEAVES:
          children:
            DC1_LEAF1:
              hosts:
                DC1-LEAF1A:
                  ansible_host: 192.168.0.13
                DC1-LEAF1B:
                  ansible_host: 192.168.0.14
            DC1_LEAF2:
              hosts:
                DC1-LEAF2A:
                  ansible_host: 192.168.0.15
                DC1-LEAF2B:
                  ansible_host: 192.168.0.16
            DC1_LEAF3:
              hosts:
                DC1-LEAF3A:
                  ansible_host: 192.168.0.17
                DC1-LEAF3B:
                  ansible_host: 192.168.0.18

    # DC2 - Second datacenter with spine/leaf fabric nodes
    DC2:
      children:
        DC2_SPINES:
          hosts:
            DC2-SPINE1:
              ansible_host: 192.168.0.20
            DC2-SPINE2:
              ansible_host: 192.168.0.21
            DC2-SPINE3:
              ansible_host: 192.168.0.22
        DC2_LEAVES:
          children:
            DC2_LEAF1:
              hosts:
                DC2-LEAF1A:
                  ansible_host: 192.168.0.24
                DC2-LEAF1B:
                  ansible_host: 192.168.0.25
            DC2_LEAF2:
              hosts:
                DC2-LEAF2A:
                  ansible_host: 192.168.0.26
                DC2-LEAF2B:
                  ansible_host: 192.168.0.27

    # Connected endpoints (servers/hosts) for endpoint connectivity
    CONNECTED_ENDPOINTS:
      children:
        HOSTS:

    # Hosts - all servers/endpoints across datacenters
    HOSTS:
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      hosts:
        DC1-HOST1:
          ansible_host: 192.168.0.30
        DC1-HOST2:
          ansible_host: 192.168.0.31
        DC2-HOST1:
          ansible_host: 192.168.0.32
        DC2-HOST2:
          ansible_host: 192.168.0.33

    # Network services group for VRF/VLAN management
    NETWORK_SERVICES:
      children:
        DC1_LEAVES:
        DC2_LEAVES:

    # Common settings across all DCs
    COMMON_SETTINGS:
      children:
        DC1:
        DC2:
