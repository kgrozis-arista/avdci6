---
# DC2 Spine-Leaf topology definition
# Uplink and MLAG IP pool configuration
# P2P links auto-generated by AVD based on uplink_switches/downlink_interfaces

p2p_links_ip_pools:
  - name: dc2_leaf_spine_pool
    ipv4_pool: 10.30.0.0/24

p2p_links_profiles:
  - name: dc2_leaf_spine_profile
    ip_pool: dc2_leaf_spine_pool
    mtu: 1500

# MLAG peer link IP pool (required for MLAG pairs)
mlag_peer_ipv4_pool: 10.60.0.0/24
