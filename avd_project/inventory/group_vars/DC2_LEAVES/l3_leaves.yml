---
# Leaf switch configuration for DC2
# Role-specific settings for L3 leaf switches with AVD 6.x structure
type: l3leaf

l3leaf:
  defaults:
    platform: vEOS-lab
    loopback_ipv4_pool: 10.10.3.0/24
    loopback_ipv4_offset: 0
    uplink_ipv4_pool: 10.30.0.0/24
    uplink_switches: [DC2-SPINE1, DC2-SPINE2, DC2-SPINE3]
    uplink_interfaces: [Ethernet51/1, Ethernet52/1, Ethernet53/1]
    mlag_peer_ipv4_pool: 10.60.0.0/24
    mlag_peer_l3_ipv4_pool: 10.65.0.0/24
    mlag_interfaces: [Ethernet49/1, Ethernet50/1]
    spanning_tree_mode: none
    virtual_router_mac_address: 00:1c:73:00:00:99
    vtep_loopback_ipv4_pool: 101.1.1.0/24
    bgp_defaults:
      - timers bgp 5 15
      - neighbor default send-community
      - neighbor default send-community extended

  node_groups:
    - group: DC2_LEAF1
      bgp_as: 65201
      nodes:
        - name: DC2-LEAF1A
          id: 11
          mgmt_ip: 192.168.0.24/24
          uplink_switch_interfaces: [Ethernet1/1, Ethernet1/1, Ethernet1/1]
        - name: DC2-LEAF1B
          id: 12
          mgmt_ip: 192.168.0.25/24
          uplink_switch_interfaces: [Ethernet2/1, Ethernet2/1, Ethernet2/1]

    - group: DC2_LEAF2
      bgp_as: 65202
      evpn_gateway:
        evpn_l2:
          enabled: true
        evpn_l3:
          enabled: true
          inter_domain: true
      nodes:
        - name: DC2-LEAF2A
          id: 13
          mgmt_ip: 192.168.0.26/24
          uplink_switch_interfaces: [Ethernet3/1, Ethernet3/1, Ethernet3/1]
        - name: DC2-LEAF2B
          id: 14
          mgmt_ip: 192.168.0.27/24
          uplink_switch_interfaces: [Ethernet4/1, Ethernet4/1, Ethernet4/1]

# Node numbering algorithm
fabric_numbering:
  node_id:
    algorithm: pool_manager
