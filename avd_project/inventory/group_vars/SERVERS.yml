---
port_profiles:
  - profile: TENANT_Prod_Dev
    mode: trunk
    vlans: "10,20,30,50"
    native_vlan: 4092
    spanning_tree_portfast: edge

servers:
  - name: DC1-HOST1
    rack: RackA
    adapters:
      - endpoint_ports: [Ethernet1, Ethernet2]
        switch_ports: [Ethernet1, Ethernet1]
        switches: [DC1-LEAF1A, DC1-LEAF1B]
        description: DC1-HOST1
        profile: TENANT_Prod_Dev
        port_channel:
          description: DC1-HOST1
          mode: "active"

  - name: DC1-HOST2
    rack: RackB
    adapters:
      - endpoint_ports: [Ethernet1, Ethernet2]
        switch_ports: [Ethernet1, Ethernet1]
        switches: [DC1-LEAF2A, DC1-LEAF2B]
        profile: TENANT_Prod_Dev
        description: DC1-HOST2
        port_channel:
          description: DC1-HOST1
          mode: "active"

  - name: DC2-HOST1
    rack: RackA
    adapters:
      - endpoint_ports: [Ethernet1, Ethernet2]
        switch_ports: [Ethernet1, Ethernet1]
        switches: [DC2-LEAF1A, DC2-LEAF1B]
        profile: TENANT_Prod_Dev
        description: DC2-HOST1
        port_channel:
          description: DC2-HOST1
          mode: active

  - name: DC2-HOST2
    rack: RackA
    adapters:
      - endpoint_ports: [Ethernet1, Ethernet2]
        switch_ports: [Ethernet1, Ethernet1]
        switches: [DC2-LEAF2A, DC2-LEAF2B]
        profile: TENANT_Prod_Dev
        description: DC2-HOST2
        port_channel:
          description: DC2-HOST2
          mode: active
