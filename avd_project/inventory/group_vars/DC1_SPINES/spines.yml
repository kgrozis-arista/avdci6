---
# Spine switch configuration for DC1
# Role-specific settings for spine switches with AVD 6.x structure

type: spine

spine:
  defaults:
    platform: vEOS-lab
    bgp_as: 65000
    loopback_ipv4_pool: 10.10.0.0/24
    loopback_ipv4_offset: 0
    spanning_tree_mode: none
    bgp_defaults:
      - timers bgp 5 15
      - neighbor default send-community
      - neighbor default send-community extended

  node_groups:
    - group: DC1_SPINES
      nodes:
        - name: DC1-SPINE1
          id: 1
          mgmt_ip: 192.168.0.10/24
        - name: DC1-SPINE2
          id: 2
          mgmt_ip: 192.168.0.11/24
        - name: DC1-SPINE3
          id: 3
          mgmt_ip: 192.168.0.12/24

# Node numbering algorithm
fabric_numbering:
  node_id:
    algorithm: pool_manager
