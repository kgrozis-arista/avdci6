---
# Common AVD group variables
fabric_name: DC
root_dir: '{{ inventory_dir | dirname }}/DC-information'
use_mgmt_interface_vrf: false

# Generate CSVs with fabric link info.
eos_designs_documentation:
  topology_csv: true
  p2p_links_csv: true

# Define underlay and overlay routing protocol to be used
overlay_routing_protocol: ebgp
underlay_routing_protocol: ospf

# Local users
local_users:
  - name: admin
    privilege: 15
    role: network-admin
    # yamllint disable-line rule:line-length
    sha512_password: "$6$Df86J4/SFMDE3/1K$Hef4KstdoxNDaami37cBquTWOTplC.miMPjXVgQxMe92.e5wxlnXOLlebgPj8Fz1KO0za/RCO7ZIs4Q6Eiq1g1"
  - name: cvpadmin
    privilege: 15
    role: network-admin
    # yamllint disable-line rule:line-length
    sha512_password: "$6$qI16FDuEyTyahgyH$su2QQ4zgkOLu1269G7PM1pdM0xHV0AeBJ6nSUzCcGeTrIqCJYpEK8t/KKDtUy6Q8YyUGoYe2ZFPNYqprB482b0"
  - name: ansible
    privilege: 15
    role: network-admin
    # yamllint disable-line rule:line-length
    sha512_password: "$6$Dzu11L7yp9j3nCM9$FSptxMPyIL555OMO.ldnjDXgwZmrfMYwHSr0uznE5Qoqvd9a6UdjiFcJUhGLtvXVZR1r.A/iF5aAt50hf/EK4/"

# BGP peer groups passwords
bgp_peer_groups:
  # all passwords set to "arista"
  evpn_overlay_peers:
    # yamllint disable-line rule:line-length
    # password: "{{ 'Q4fqtbqcZ7oQuKfuWtNGRQ==' | arista.avd.hide_passwords(true)  }}"
    password: Q4fqtbqcZ7oQuKfuWtNGRQ==
  ipv4_underlay_peers:
    password: 7x4B4rnJhZB438m9+BrBfQ==
  mlag_ipv4_underlay_peer:
    password: 4b21pAdCvWeAqpcKDFMdWw==

# P2P interfaces MTU, includes VLANs 4093 and 4094 that are over peer-link
# yamllint disable-line rule:line-length
# If you're running vEOS-lab or cEOS, you should use MTU of 1500 instead as shown in the following line
# p2p_uplinks_mtu: 9214
p2p_uplinks_mtu: 1500

# CloudVision Portal definitions
# cv_settings:
#   # cvp host
#   onprem_clusters:
#     - name: primary
#       servers:
#         - name: 192.168.0.5
# cvaas host
#    cvaas:
#      enabled: true
#      - name: cvaas
#        servers:
#          - name: www.cv-staging.corp.arista.io
#        # yamllint disable-line rule:line-length
#        # cvaas host token, used to authenticate with CVaaS API
#        token: "{{ lookup('ansible.builtin.file', '/home/ansible/CV_TOKEN') }}"
#    terminattr:
#      disable_aaa: true

# DNS Server
dns_settings:
  servers:
    - ip_address: 1.1.1.1
      vrf: default

# yamllint disable-line rule:line-length
# NTP Servers IP or DNS name, first NTP server will be preferred, and sourced from Management VRF
ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: 0.pool.ntp.org
    - name: 1.pool.ntp.org

# Set default uplink, downlink, and MLAG interfaces based on node type
default_interfaces:
  - types: [spine]
    platforms: [default]
    # yamllint disable-line rule:line-length
    downlink_interfaces: [Ethernet1/1, Ethernet2/1, Ethernet3/1, Ethernet4/1, Ethernet5/1, Ethernet6/1]
  - types: [l3leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet51/1, Ethernet52/1, Ethernet53/1]
    mlag_interfaces: [Ethernet49/1, Ethernet50/1]

# Routing
static_routes:
  - vrf: default
    prefix: 0.0.0.0/0
    next_hop: 192.168.0.6

terminattr_smashexcludes: "ale,flexCounter,hardware,kni,pulse,strata"
terminattr_ingestexclude: "/Sysdb/cell/1/agent,/Sysdb/cell/2/agent"
