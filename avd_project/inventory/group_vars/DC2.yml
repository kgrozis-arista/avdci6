---
mgmt_interface_vrf: default

spine:
  # Define variables for all nodes of this type
  defaults:
    # yamllint disable-line rule:line-length
    # Set the relevant platform as each platform has different default values in Ansible AVD
    platform: vEOS-lab
    loopback_ipv4_pool: 102.2.1.0/24
    bgp_as: 65200
  # Define variables per node
  nodes:
    - name: DC2-SPINE1
      # Unique identifier used for IP addressing and other algorithms
      id: 1
      mgmt_ip: 192.168.0.120/24
      serial_number: SN-DC2-SPINE1

    - name: DC2-SPINE2
      id: 2
      mgmt_ip: 192.168.0.121/24
      serial_number: SN-DC2-SPINE2

    - name: DC2-SPINE3
      id: 3
      mgmt_ip: 192.168.0.122/24
      serial_number: SN-DC2-SPINE3

l3leaf:
  defaults:
    # yamllint disable-line rule:line-length
    # Set the relevant platform as each platform has different default values in Ansible AVD
    platform: vEOS-lab
    # yamllint disable-line rule:line-length
    # Pool of IPv4 addresses to configure interface Loopback0 used for BGP EVPN sessions
    loopback_ipv4_pool: 102.2.1.0/24
    # Offset all assigned loopback IP addresses.
    loopback_ipv4_offset: 4
    # yamllint disable-line rule:line-length
    # Definition of pool of IPs to be used as Virtual Tunnel EndPoint (VXLAN
    vtep_loopback_ipv4_pool: 102.2.2.0/24
    # yamllint disable-line rule:line-length
    # Ansible hostname of the devices used to establish neighborship (IP assignments and BGP peering)
    uplink_switches: ['DC2-SPINE1', 'DC2-SPINE2', 'DC2-SPINE3']
    # Definition of pool of IPs to be used in P2P links
    uplink_ipv4_pool: 172.31.251.0/24
    # Definition of pool of IPs to be used for MLAG peer-link connectivity
    mlag_peer_ipv4_pool: 10.255.130.64/27
    # iBGP Peering between MLAG peers
    mlag_peer_l3_ipv4_pool: 10.255.130.96/27
    # yamllint disable-line rule:line-length
    # Virtual router mac for VNIs assigned to Leaf switches in format xx:xx:xx:xx:xx:xx
    virtual_router_mac_address: 00:1c:73:00:00:99
    spanning_tree_priority: 4096
    spanning_tree_mode: mstp

  node_groups:
    - group: DC2_LEAF1
      bgp_as: 65201
      nodes:
        - name: DC2-LEAF1A
          id: 1
          mgmt_ip: 192.168.0.124/24
          serial_number: SN-DC2-LEAF1A
          uplink_switch_interfaces: [Ethernet1/1, Ethernet1/1, Ethernet1/1]
        - name: DC2-LEAF1B
          id: 2
          mgmt_ip: 192.168.0.125/24
          serial_number: SN-DC2-LEAF1B
          uplink_switch_interfaces: [Ethernet2/1, Ethernet2/1, Ethernet2/1]

    - group: DC1_LEAF2
      bgp_as: 65202
      evpn_gateway:
        evpn_l2:
          enabled: true
        evpn_l3:
          enabled: true
          inter_domain: true
      nodes:
        - name: DC2-LEAF2A
          id: 3
          mgmt_ip: 192.168.0.126/24
          serial_number: SN-DC2-LEAF2A
          uplink_switch_interfaces: [Ethernet3/1, Ethernet3/1, Ethernet3/1]
          evpn_gateway:
            remote_peers:
              - hostname: DC1-LEAF3A
        - name: DC2-LEAF2B
          id: 4
          mgmt_ip: 192.168.0.127/24
          serial_number: SN-DC2-LEAF2B
          uplink_switch_interfaces: [Ethernet4/1, Ethernet4/1, Ethernet4/1]
          evpn_gateway:
            remote_peers:
              - hostname: DC1-LEAF3B
