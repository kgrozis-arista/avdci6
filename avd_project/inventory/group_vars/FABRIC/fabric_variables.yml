---
# Fabric-wide variables for multi-datacenter Spine-Leaf Clos topology
# Applied to all devices in the FABRIC group

# AVD output directory configuration
output_dir: AVD-information

# Fabric identification
fabric_name: FABRIC

# Underlay and overlay routing protocols
underlay_routing_protocol: ebgp
overlay_routing_protocol: ebgp

# BGP default settings
bgp_defaults:
  - timers bgp 5 15
  - neighbor default send-community
  - neighbor default send-community extended

# MTU for P2P links (vEOS-lab requirement)
p2p_uplinks_mtu: 1500

# BFD for fast failure detection
bfd_multihop:
  interval: 300
  min_rx: 300
  multiplier: 3

# Spanning tree configuration
spanning_tree_mode: none

# Management interface configuration (AVD 6.x format)
mgmt_interface_settings:
  interface: Management1
  vrf: MGMT

mgmt_gateway: 192.168.0.1

# Management API (eAPI) configuration - required for ANTA validation
# AVD 6.x flips management_eapi.enabled default from true to false.
# Keep eAPI on so the httpapi connection in inventory.yml works.
management_eapi:
  enabled: true

# ANTA test catalog generation for validation
anta_catalog:
  - filename: AVD_ANTA_CATALOG.yml

# CloudVision Portal configuration
cv_settings:
  onprem_clusters:
    - name: cvp-primary
      servers:
        - name: 192.168.0.5
  terminattr:
    smashexcludes: "ale,flexCounter,hardware,kni,pulse,strata"
    ingestexclude: "/Sysdb/cell/1/agent,/Sysdb/cell/2/agent"

# NTP settings required when CloudVision clusters are defined
ntp_settings:
  server_vrf: use_mgmt_interface_vrf
  servers:
    - name: 0.pool.ntp.org
    - name: 1.pool.ntp.org

# Local users for device access
aaa_settings:
  local_users:
    - name: admin
      privilege: 15
      role: network-admin
      sha512_password: "$6$Df86J4/SFMDE3/1K$Hef4KstdoxNDaami37cBquTWOTplC.miMPjXVgQxMe92.e5wxlnXOLlebgPj8Fz1KO0za/RCO7ZIs4Q6Eiq1g1"
    - name: cvpadmin
      privilege: 15
      role: network-admin
      sha512_password: "$6$qI16FDuEyTyahgyH$su2QQ4zgkOLu1269G7PM1pdM0xHV0AeBJ6nSUzCcGeTrIqCJYpEK8t/KKDtUy6Q8YyUGoYe2ZFPNYqprB482b0"
    - name: ansible
      privilege: 15
      role: network-admin
      sha512_password: "$6$Dzu11L7yp9j3nCM9$FSptxMPyIL555OMO.ldnjDXgwZmrfMYwHSr0uznE5Qoqvd9a6UdjiFcJUhGLtvXVZR1r.A/iF5aAt50hf/EK4/"

# Default interfaces configuration
default_interfaces:
  - types: [spine]
    platforms: [default]
    downlink_interfaces: [Ethernet1/1, Ethernet2/1, Ethernet3/1, Ethernet4/1, Ethernet5/1, Ethernet6/1]
  - types: [l3leaf]
    platforms: [default]
    uplink_interfaces: [Ethernet51/1, Ethernet52/1, Ethernet53/1]
    mlag_interfaces: [Ethernet49/1, Ethernet50/1]
