  - ip_address: 10.10.3.13
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65202'
    metadata:
      peer: DC2-LEAF2A
    description: DC2-LEAF2A_Loopback0
  - ip_address: 10.10.3.14
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65202'
    metadata:
      peer: DC2-LEAF2B
    description: DC2-LEAF2B_Loopback0
