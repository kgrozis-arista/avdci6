!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$Df86J4/SFMDE3/1K$Hef4KstdoxNDaami37cBquTWOTplC.miMPjXVgQxMe92.e5wxlnXOLlebgPj8Fz1KO0za/RCO7ZIs4Q6Eiq1g1
username ansible privilege 15 role network-admin secret sha512 $6$Dzu11L7yp9j3nCM9$FSptxMPyIL555OMO.ldnjDXgwZmrfMYwHSr0uznE5Qoqvd9a6UdjiFcJUhGLtvXVZR1r.A/iF5aAt50hf/EK4/
username cvpadmin privilege 15 role network-admin secret sha512 $6$qI16FDuEyTyahgyH$su2QQ4zgkOLu1269G7PM1pdM0xHV0AeBJ6nSUzCcGeTrIqCJYpEK8t/KKDtUy6Q8YyUGoYe2ZFPNYqprB482b0
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.0.5:9910 -cvauth=token,/tmp/token -cvvrf=MGMT -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs -cvsourceintf=Management1
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname DC1-SPINE3
!
spanning-tree mode none
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1/1
   description P2P_DC1-LEAF1A_Ethernet53/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.20.0.22/31
!
interface Ethernet2/1
   description P2P_DC1-LEAF1B_Ethernet53/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.20.0.28/31
!
interface Ethernet3/1
   description P2P_DC1-LEAF2A_Ethernet53/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.20.0.34/31
!
interface Ethernet4/1
   description P2P_DC1-LEAF2B_Ethernet53/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.20.0.40/31
!
interface Ethernet5/1
   description P2P_DC1-LEAF3A_Ethernet53/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.20.0.88/31
!
interface Ethernet6/1
   description P2P_DC1-LEAF3B_Ethernet53/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.20.0.94/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.10.0.3/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.12/24
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.10.0.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.5
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 216.239.35.4 prefer
ntp server vrf MGMT 216.239.35.8
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65000
   router-id 10.10.0.3
   no bgp default ipv4-unicast
   maximum-paths 4
   timers bgp 5 15
   neighbor default send-community
   neighbor default send-community extended
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS next-hop-unchanged
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.10.1.4 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.1.4 remote-as 65101
   neighbor 10.10.1.4 description DC1-LEAF1A_Loopback0
   neighbor 10.10.1.5 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.1.5 remote-as 65101
   neighbor 10.10.1.5 description DC1-LEAF1B_Loopback0
   neighbor 10.10.1.6 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.1.6 remote-as 65102
   neighbor 10.10.1.6 description DC1-LEAF2A_Loopback0
   neighbor 10.10.1.7 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.1.7 remote-as 65102
   neighbor 10.10.1.7 description DC1-LEAF2B_Loopback0
   neighbor 10.10.1.15 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.1.15 remote-as 65103
   neighbor 10.10.1.15 description DC1-LEAF3A_Loopback0
   neighbor 10.10.1.16 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.1.16 remote-as 65103
   neighbor 10.10.1.16 description DC1-LEAF3B_Loopback0
   neighbor 10.20.0.23 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.20.0.23 remote-as 65101
   neighbor 10.20.0.23 description DC1-LEAF1A_Ethernet53/1
   neighbor 10.20.0.29 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.20.0.29 remote-as 65101
   neighbor 10.20.0.29 description DC1-LEAF1B_Ethernet53/1
   neighbor 10.20.0.35 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.20.0.35 remote-as 65102
   neighbor 10.20.0.35 description DC1-LEAF2A_Ethernet53/1
   neighbor 10.20.0.41 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.20.0.41 remote-as 65102
   neighbor 10.20.0.41 description DC1-LEAF2B_Ethernet53/1
   neighbor 10.20.0.89 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.20.0.89 remote-as 65103
   neighbor 10.20.0.89 description DC1-LEAF3A_Ethernet53/1
   neighbor 10.20.0.95 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.20.0.95 remote-as 65103
   neighbor 10.20.0.95 description DC1-LEAF3B_Ethernet53/1
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
