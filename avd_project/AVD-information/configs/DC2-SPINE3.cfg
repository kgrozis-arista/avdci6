!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$Df86J4/SFMDE3/1K$Hef4KstdoxNDaami37cBquTWOTplC.miMPjXVgQxMe92.e5wxlnXOLlebgPj8Fz1KO0za/RCO7ZIs4Q6Eiq1g1
username ansible privilege 15 role network-admin secret sha512 $6$Dzu11L7yp9j3nCM9$FSptxMPyIL555OMO.ldnjDXgwZmrfMYwHSr0uznE5Qoqvd9a6UdjiFcJUhGLtvXVZR1r.A/iF5aAt50hf/EK4/
username cvpadmin privilege 15 role network-admin secret sha512 $6$qI16FDuEyTyahgyH$su2QQ4zgkOLu1269G7PM1pdM0xHV0AeBJ6nSUzCcGeTrIqCJYpEK8t/KKDtUy6Q8YyUGoYe2ZFPNYqprB482b0
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.0.5:9910 -cvauth=token,/tmp/token -cvvrf=MGMT -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs -cvsourceintf=Management1
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname DC2-SPINE3
!
spanning-tree mode none
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Ethernet1/1
   description P2P_DC2-LEAF1A_Ethernet53/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.30.0.64/31
!
interface Ethernet2/1
   description P2P_DC2-LEAF1B_Ethernet53/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.30.0.70/31
!
interface Ethernet3/1
   description P2P_DC2-LEAF2A_Ethernet53/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.30.0.76/31
!
interface Ethernet4/1
   description P2P_DC2-LEAF2B_Ethernet53/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.30.0.82/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.10.2.10/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.22/24
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.10.2.0/24 eq 32
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.5
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 216.239.35.4 prefer
ntp server vrf MGMT 216.239.35.8
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
router bgp 65200
   router-id 10.10.2.10
   no bgp default ipv4-unicast
   maximum-paths 4
   timers bgp 5 15
   neighbor default send-community
   neighbor default send-community extended
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.30.0.65 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.30.0.65 remote-as 65201
   neighbor 10.30.0.65 description DC2-LEAF1A_Ethernet53/1
   neighbor 10.30.0.71 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.30.0.71 remote-as 65201
   neighbor 10.30.0.71 description DC2-LEAF1B_Ethernet53/1
   neighbor 10.30.0.77 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.30.0.77 remote-as 65202
   neighbor 10.30.0.77 description DC2-LEAF2A_Ethernet53/1
   neighbor 10.30.0.83 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.30.0.83 remote-as 65202
   neighbor 10.30.0.83 description DC2-LEAF2B_Ethernet53/1
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
!
end
