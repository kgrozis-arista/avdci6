!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$Df86J4/SFMDE3/1K$Hef4KstdoxNDaami37cBquTWOTplC.miMPjXVgQxMe92.e5wxlnXOLlebgPj8Fz1KO0za/RCO7ZIs4Q6Eiq1g1
username ansible privilege 15 role network-admin secret sha512 $6$Dzu11L7yp9j3nCM9$FSptxMPyIL555OMO.ldnjDXgwZmrfMYwHSr0uznE5Qoqvd9a6UdjiFcJUhGLtvXVZR1r.A/iF5aAt50hf/EK4/
username cvpadmin privilege 15 role network-admin secret sha512 $6$qI16FDuEyTyahgyH$su2QQ4zgkOLu1269G7PM1pdM0xHV0AeBJ6nSUzCcGeTrIqCJYpEK8t/KKDtUy6Q8YyUGoYe2ZFPNYqprB482b0
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.0.5:9910 -cvauth=token,/tmp/token -cvvrf=MGMT -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs -cvsourceintf=Management1
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname DC1-LEAF2A
!
spanning-tree mode none
no spanning-tree vlan-id 4093-4094
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel1
   description DC1-HOST2 LAG
   no shutdown
   switchport trunk native vlan 4092
   switchport trunk allowed vlan 10,20,30,50
   switchport mode trunk
   switchport
   mlag 1
   spanning-tree portfast
!
interface Port-Channel491
   description MLAG_DC1-LEAF2B_Port-Channel491
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet1
   description DC1-HOST2 dual uplinks
   no shutdown
   channel-group 1 mode active
!
interface Ethernet49/1
   description MLAG_DC1-LEAF2B_Ethernet49/1
   no shutdown
   channel-group 491 mode active
!
interface Ethernet50/1
   description MLAG_DC1-LEAF2B_Ethernet50/1
   no shutdown
   channel-group 491 mode active
!
interface Ethernet51/1
   description P2P_DC1-SPINE1_Ethernet3/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.20.0.31/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet52/1
   description P2P_DC1-SPINE2_Ethernet3/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.20.0.33/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Ethernet53/1
   description P2P_DC1-SPINE3_Ethernet3/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.20.0.35/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.10.1.6/32
   ip ospf area 0.0.0.0
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 101.1.1.6/32
   ip ospf area 0.0.0.0
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.15/24
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 1500
   ip address 10.55.0.10/31
   ip ospf network point-to-point
   ip ospf area 0.0.0.0
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.50.0.10/31
!
interface Vxlan1
   description DC1-LEAF2A_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip routing
no ip routing vrf MGMT
!
mlag configuration
   domain-id DC1_LEAF2
   local-interface Vlan4094
   peer-address 10.50.0.11
   peer-link Port-Channel491
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.5
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 216.239.35.4 prefer
ntp server vrf MGMT 216.239.35.8
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65102
   router-id 10.10.1.6
   no bgp default ipv4-unicast
   maximum-paths 4
   timers bgp 5 15
   neighbor default send-community
   neighbor default send-community extended
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor 10.10.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.0.1 remote-as 65000
   neighbor 10.10.0.1 description DC1-SPINE1_Loopback0
   neighbor 10.10.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.0.2 remote-as 65000
   neighbor 10.10.0.2 description DC1-SPINE2_Loopback0
   neighbor 10.10.0.3 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.0.3 remote-as 65000
   neighbor 10.10.0.3 description DC1-SPINE3_Loopback0
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
!
router ospf 100
   router-id 10.10.1.6
   passive-interface default
   no passive-interface Ethernet51/1
   no passive-interface Ethernet52/1
   no passive-interface Ethernet53/1
   no passive-interface Vlan4093
   max-lsa 12000
   graceful-restart
!
end
