!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$Df86J4/SFMDE3/1K$Hef4KstdoxNDaami37cBquTWOTplC.miMPjXVgQxMe92.e5wxlnXOLlebgPj8Fz1KO0za/RCO7ZIs4Q6Eiq1g1
username ansible privilege 15 role network-admin secret sha512 $6$Dzu11L7yp9j3nCM9$FSptxMPyIL555OMO.ldnjDXgwZmrfMYwHSr0uznE5Qoqvd9a6UdjiFcJUhGLtvXVZR1r.A/iF5aAt50hf/EK4/
username cvpadmin privilege 15 role network-admin secret sha512 $6$qI16FDuEyTyahgyH$su2QQ4zgkOLu1269G7PM1pdM0xHV0AeBJ6nSUzCcGeTrIqCJYpEK8t/KKDtUy6Q8YyUGoYe2ZFPNYqprB482b0
!
daemon TerminAttr
   exec /usr/bin/TerminAttr -cvaddr=192.168.0.5:9910 -cvauth=token,/tmp/token -cvvrf=MGMT -smashexcludes=ale,flexCounter,hardware,kni,pulse,strata -ingestexclude=/Sysdb/cell/1/agent,/Sysdb/cell/2/agent -taillogs -cvsourceintf=Management1
   no shutdown
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
hostname DC2-LEAF2A
!
spanning-tree mode none
no spanning-tree vlan-id 4093-4094
!
vlan 10
   name VRF_Prod_VLAN10
!
vlan 20
   name VRF_Prod_VLAN20
!
vlan 30
   name VLAN30_VRF_Dev
!
vlan 50
   name VLAN50_L2_Only
!
vlan 3099
   name MLAG_L3_VRF_Prod
   trunk group MLAG
!
vlan 3299
   name MLAG_L3_VRF_Dev
   trunk group MLAG
!
vlan 4093
   name MLAG_L3
   trunk group MLAG
!
vlan 4094
   name MLAG
   trunk group MLAG
!
vrf instance Dev
!
vrf instance MGMT
!
vrf instance Prod
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
interface Port-Channel491
   description MLAG_DC2-LEAF2B_Port-Channel491
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG
   switchport
!
interface Ethernet49/1
   description MLAG_DC2-LEAF2B_Ethernet49/1
   no shutdown
   channel-group 491 mode active
!
interface Ethernet50/1
   description MLAG_DC2-LEAF2B_Ethernet50/1
   no shutdown
   channel-group 491 mode active
!
interface Ethernet51/1
   description P2P_DC2-SPINE1_Ethernet3/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.30.0.73/31
!
interface Ethernet52/1
   description P2P_DC2-SPINE2_Ethernet3/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.30.0.75/31
!
interface Ethernet53/1
   description P2P_DC2-SPINE3_Ethernet3/1
   no shutdown
   mtu 1500
   no switchport
   ip address 10.30.0.77/31
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.10.3.13/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 101.1.1.13/32
!
interface Loopback6
   description DIAG_VRF_Prod
   no shutdown
   vrf Prod
   ip address 9.9.1.13/32
!
interface Loopback7
   description DIAG_VRF_Dev
   no shutdown
   vrf Dev
   ip address 9.9.2.13/32
!
interface Management1
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 192.168.0.26/24
!
interface Vlan10
   description VRF_Prod_VLAN10
   no shutdown
   vrf Prod
   ip address virtual 10.10.10.1/24
!
interface Vlan20
   description VRF_Prod_VLAN20
   no shutdown
   vrf Prod
   ip address virtual 20.20.20.1/24
!
interface Vlan30
   description VLAN30_VRF_Dev
   no shutdown
   vrf Dev
   ip address virtual 30.30.30.1/24
!
interface Vlan3099
   description MLAG_L3_VRF_Prod
   no shutdown
   mtu 1500
   vrf Prod
   ip address 10.65.0.24/31
!
interface Vlan3299
   description MLAG_L3_VRF_Dev
   no shutdown
   mtu 1500
   vrf Dev
   ip address 10.65.0.24/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 1500
   ip address 10.65.0.24/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 1500
   no autostate
   ip address 10.60.0.24/31
!
interface Vxlan1
   description DC2-LEAF2A_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vlan 30 vni 20030
   vxlan vlan 50 vni 10050
   vxlan vrf Dev vni 300
   vxlan vrf Prod vni 100
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip address virtual source-nat vrf Dev address 9.9.2.13
ip address virtual source-nat vrf Prod address 9.9.1.13
!
ip routing
ip routing vrf Dev
no ip routing vrf MGMT
ip routing vrf Prod
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.10.3.0/24 eq 32
   seq 20 permit 101.1.1.0/24 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 10.65.0.24/31
!
mlag configuration
   domain-id DC2_LEAF2
   local-interface Vlan4094
   peer-address 10.60.0.25
   peer-link Port-Channel491
   reload-delay mlag 300
   reload-delay non-mlag 330
!
ip route vrf MGMT 0.0.0.0/0 192.168.0.5
!
ntp local-interface vrf MGMT Management1
ntp server vrf MGMT 216.239.35.4 prefer
ntp server vrf MGMT 216.239.35.8
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-IN permit 10
   description Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
   set origin incomplete
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65202
   router-id 10.10.3.13
   no bgp default ipv4-unicast
   maximum-paths 4
   timers bgp 5 15
   neighbor default send-community
   neighbor default send-community extended
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor MLAG-IPv4-UNDERLAY-PEER peer group
   neighbor MLAG-IPv4-UNDERLAY-PEER remote-as 65202
   neighbor MLAG-IPv4-UNDERLAY-PEER next-hop-self
   neighbor MLAG-IPv4-UNDERLAY-PEER description DC2-LEAF2B
   neighbor MLAG-IPv4-UNDERLAY-PEER route-map RM-MLAG-PEER-IN in
   neighbor MLAG-IPv4-UNDERLAY-PEER send-community
   neighbor MLAG-IPv4-UNDERLAY-PEER maximum-routes 256000
   neighbor 10.10.2.8 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.2.8 remote-as 65200
   neighbor 10.10.2.8 description DC2-SPINE1_Loopback0
   neighbor 10.10.2.9 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.2.9 remote-as 65200
   neighbor 10.10.2.9 description DC2-SPINE2_Loopback0
   neighbor 10.10.2.10 peer group EVPN-OVERLAY-PEERS
   neighbor 10.10.2.10 remote-as 65200
   neighbor 10.10.2.10 description DC2-SPINE3_Loopback0
   neighbor 10.30.0.72 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.30.0.72 remote-as 65200
   neighbor 10.30.0.72 description DC2-SPINE1_Ethernet3/1
   neighbor 10.30.0.74 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.30.0.74 remote-as 65200
   neighbor 10.30.0.74 description DC2-SPINE2_Ethernet3/1
   neighbor 10.30.0.76 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.30.0.76 remote-as 65200
   neighbor 10.30.0.76 description DC2-SPINE3_Ethernet3/1
   neighbor 10.65.0.25 peer group MLAG-IPv4-UNDERLAY-PEER
   neighbor 10.65.0.25 description DC2-LEAF2B_Vlan4093
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 10
      rd 10.10.3.13:10010
      route-target both 10010:10010
      redistribute learned
   !
   vlan 20
      rd 10.10.3.13:10020
      route-target both 10020:10020
      redistribute learned
   !
   vlan 30
      rd 10.10.3.13:20030
      route-target both 20030:20030
      redistribute learned
   !
   vlan 50
      rd 10.10.3.13:10050
      route-target both 10050:10050
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      no neighbor EVPN-OVERLAY-PEERS activate
      neighbor IPv4-UNDERLAY-PEERS activate
      neighbor MLAG-IPv4-UNDERLAY-PEER activate
   !
   vrf Dev
      rd 10.10.3.13:300
      route-target import evpn 300:300
      route-target export evpn 300:300
      router-id 10.10.3.13
      neighbor 10.65.0.25 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.65.0.25 description DC2-LEAF2B_Vlan3299
      redistribute connected route-map RM-CONN-2-BGP-VRFS
   !
   vrf Prod
      rd 10.10.3.13:100
      route-target import evpn 100:100
      route-target export evpn 100:100
      router-id 10.10.3.13
      neighbor 10.65.0.25 peer group MLAG-IPv4-UNDERLAY-PEER
      neighbor 10.65.0.25 description DC2-LEAF2B_Vlan3099
      redistribute connected route-map RM-CONN-2-BGP-VRFS
!
end
