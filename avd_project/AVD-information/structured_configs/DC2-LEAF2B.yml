  dc_name: DC2
  fabric_name: FABRIC
  validate_hardware:
    enabled: false
mlag_configuration:
  domain_id: DC2_LEAF2
  local_interface: Vlan4094
  peer_address: 10.60.0.24
  peer_link: Port-Channel491
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: 216.239.35.4
    preferred: true
  - name: 216.239.35.8
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel491
  description: MLAG_DC2-LEAF2A_Port-Channel491
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
- name: Port-Channel1
  description: DC2-HOST2 LAG
  shutdown: false
  mlag: 1
  spanning_tree_portfast: edge
  switchport:
    enabled: true
    mode: trunk
    trunk:
      allowed_vlan: 10,20,30,50
      native_vlan: 4092
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65202'
  router_id: 10.10.3.14
  maximum_paths:
    paths: 4
  bgp_defaults:
  - timers bgp 5 15
  - neighbor default send-community
  - neighbor default send-community extended
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.10.2.8
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE1
    description: DC2-SPINE1_Loopback0
  - ip_address: 10.10.2.9
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE2
    description: DC2-SPINE2_Loopback0
  - ip_address: 10.10.2.10
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE3
    description: DC2-SPINE3_Loopback0
  address_family_evpn:
    neighbor_default:
      next_hop_self_received_evpn_routes:
        enable: true
        inter_domain: true
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: false
router_ospf:
  process_ids:
  - id: 100
    passive_interface_default: true
    router_id: 10.10.3.14
    bfd_enable: false
    no_passive_interfaces:
    - Ethernet51/1
    - Ethernet52/1
    - Ethernet53/1
    - Vlan4093
    max_lsa: 12000
    graceful_restart:
      enabled: true
service_routing_protocols_model: multi-agent
spanning_tree:
