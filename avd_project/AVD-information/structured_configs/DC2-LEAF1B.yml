    token_file: /tmp/token
  cvsourceintf: Management1
  cvvrf: MGMT
  disable_aaa: false
  ingestexclude: /Sysdb/cell/1/agent,/Sysdb/cell/2/agent
  smashexcludes: ale,flexCounter,hardware,kni,pulse,strata
enable_password:
  disabled: true
ethernet_interfaces:
- name: Ethernet49/1
  description: MLAG_DC2-LEAF1A_Ethernet49/1
  shutdown: false
  channel_group:
    id: 491
    mode: active
  metadata:
    peer: DC2-LEAF1A
    peer_interface: Ethernet49/1
    peer_type: mlag_peer
- name: Ethernet50/1
  description: MLAG_DC2-LEAF1A_Ethernet50/1
  shutdown: false
  channel_group:
    id: 491
    mode: active
  metadata:
    peer: DC2-LEAF1A
    peer_interface: Ethernet50/1
    peer_type: mlag_peer
- name: Ethernet51/1
  description: P2P_DC2-SPINE1_Ethernet2/1
  shutdown: false
  mtu: 1500
  ip_address: 10.30.0.67/31
  metadata:
    peer: DC2-SPINE1
    peer_interface: Ethernet2/1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet52/1
  description: P2P_DC2-SPINE2_Ethernet2/1
  shutdown: false
  mtu: 1500
  ip_address: 10.30.0.69/31
  metadata:
    peer: DC2-SPINE2
    peer_interface: Ethernet2/1
    peer_type: spine
  switchport:
    enabled: false
- name: Ethernet53/1
  description: P2P_DC2-SPINE3_Ethernet2/1
  shutdown: false
  mtu: 1500
  ip_address: 10.30.0.71/31
  metadata:
    peer: DC2-SPINE3
    peer_interface: Ethernet2/1
    peer_type: spine
  switchport:
    enabled: false
hostname: DC2-LEAF1B
ip_igmp_snooping:
  globally_enabled: true
ip_routing: true
local_users:
- name: admin
  privilege: 15
  role: network-admin
  sha512_password: $6$Df86J4/SFMDE3/1K$Hef4KstdoxNDaami37cBquTWOTplC.miMPjXVgQxMe92.e5wxlnXOLlebgPj8Fz1KO0za/RCO7ZIs4Q6Eiq1g1
- name: ansible
  privilege: 15
  role: network-admin
  sha512_password: $6$Dzu11L7yp9j3nCM9$FSptxMPyIL555OMO.ldnjDXgwZmrfMYwHSr0uznE5Qoqvd9a6UdjiFcJUhGLtvXVZR1r.A/iF5aAt50hf/EK4/
- name: cvpadmin
  privilege: 15
  role: network-admin
  sha512_password: $6$qI16FDuEyTyahgyH$su2QQ4zgkOLu1269G7PM1pdM0xHV0AeBJ6nSUzCcGeTrIqCJYpEK8t/KKDtUy6Q8YyUGoYe2ZFPNYqprB482b0
loopback_interfaces:
- name: Loopback0
  description: ROUTER_ID
  shutdown: false
  ip_address: 10.10.3.12/32
- name: Loopback1
  description: VXLAN_TUNNEL_SOURCE
  shutdown: false
  ip_address: 101.1.2.11/32
management_api_http:
  enable_https: true
  enable_vrfs:
  - name: MGMT
management_interfaces:
- name: Management1
  description: OOB_MANAGEMENT
  shutdown: false
  vrf: MGMT
  ip_address: 192.168.0.25/24
  type: oob
  gateway: 192.168.0.5
metadata:
  is_deployed: true
  platform: vEOS-lab
  dc_name: DC2
  fabric_name: FABRIC
  validate_hardware:
    enabled: false
mlag_configuration:
  domain_id: DC2_LEAF1
  local_interface: Vlan4094
  peer_address: 10.60.0.20
  peer_link: Port-Channel491
  reload_delay_mlag: '300'
  reload_delay_non_mlag: '330'
ntp:
  local_interface:
    name: Management1
    vrf: MGMT
  servers:
  - name: 216.239.35.4
    preferred: true
  - name: 216.239.35.8
  vrf: MGMT
port_channel_interfaces:
- name: Port-Channel491
  description: MLAG_DC2-LEAF1A_Port-Channel491
  shutdown: false
  switchport:
    enabled: true
    mode: trunk
    trunk:
      groups:
      - MLAG
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.10.3.0/24 eq 32
  - sequence: 20
    action: permit 101.1.2.0/24 eq 32
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65201'
  router_id: 10.10.3.12
  maximum_paths:
    paths: 4
  bgp_defaults:
  - timers bgp 5 15
  - neighbor default send-community
  - neighbor default send-community extended
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65201'
    description: DC2-LEAF1A
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.65.0.20
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: DC2-LEAF1A
    description: DC2-LEAF1A_Vlan4093
  - ip_address: 10.30.0.66
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE1
    description: DC2-SPINE1_Ethernet2/1
  - ip_address: 10.30.0.68
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE2
    description: DC2-SPINE2_Ethernet2/1
  - ip_address: 10.30.0.70
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE3
    description: DC2-SPINE3_Ethernet2/1
  - ip_address: 10.10.2.8
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE1
    description: DC2-SPINE1_Loopback0
  - ip_address: 10.10.2.9
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE2
    description: DC2-SPINE2_Loopback0
  - ip_address: 10.10.2.10
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE3
    description: DC2-SPINE3_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_evpn:
    peer_groups:
    - name: EVPN-OVERLAY-PEERS
      activate: true
  address_family_ipv4:
    peer_groups:
    - name: MLAG-IPv4-UNDERLAY-PEER
      activate: true
    - name: IPv4-UNDERLAY-PEERS
      activate: true
    - name: EVPN-OVERLAY-PEERS
      activate: false
service_routing_protocols_model: multi-agent
spanning_tree:
  mode: none
  no_spanning_tree_vlan: 4093-4094
static_routes:
- vrf: MGMT
  prefix: 0.0.0.0/0
  next_hop: 192.168.0.5
transceiver_qsfp_default_mode_4x10: true
vlan_interfaces:
- name: Vlan4093
  description: MLAG_L3
  shutdown: false
  ip_address: 10.65.0.21/31
  mtu: 1500
- name: Vlan4094
  description: MLAG
  shutdown: false
  ip_address: 10.60.0.21/31
  mtu: 1500
  no_autostate: true
vlan_internal_order:
  allocation: ascending
  range:
    beginning: 1006
    ending: 1199
vlans:
- id: 4093
  name: MLAG_L3
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
- id: 4094
  name: MLAG
  trunk_groups:
  - MLAG
  metadata:
    tenants:
    - system
vrfs:
- name: MGMT
  ip_routing: false
vxlan_interface:
  vxlan1:
    description: DC2-LEAF1B_VTEP
    vxlan:
      source_interface: Loopback1
      udp_port: 4789
      virtual_router_encapsulation_mac_address: mlag-system-id
