    name: Management1
    vrf: MGMT
  servers:
  - name: 216.239.35.4
    preferred: true
  - name: 216.239.35.8
  vrf: MGMT
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.10.1.0/24 eq 32
route_maps:
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
router_bgp:
  as: '65102'
  router_id: 10.10.1.6
  maximum_paths:
    paths: 4
  bgp_defaults:
  - timers bgp 5 15
  - neighbor default send-community
  - neighbor default send-community extended
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  neighbors:
  - ip_address: 10.20.0.30
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65000'
    metadata:
      peer: DC1-SPINE1
    description: DC1-SPINE1_Ethernet3/1
  - ip_address: 10.20.0.32
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65000'
    metadata:
      peer: DC1-SPINE2
    description: DC1-SPINE2_Ethernet3/1
  - ip_address: 10.20.0.34
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65000'
    metadata:
      peer: DC1-SPINE3
    description: DC1-SPINE3_Ethernet3/1
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  address_family_ipv4:
    peer_groups:
    - name: IPv4-UNDERLAY-PEERS
      activate: true
