    mode: trunk
    trunk:
      groups:
      - MLAG
prefix_lists:
- name: PL-LOOPBACKS-EVPN-OVERLAY
  sequence_numbers:
  - sequence: 10
    action: permit 10.10.3.0/24 eq 32
  - sequence: 20
    action: permit 101.1.1.0/24 eq 32
- name: PL-MLAG-PEER-VRFS
  sequence_numbers:
  - sequence: 10
    action: permit 10.65.0.20/31
route_maps:
- name: RM-MLAG-PEER-IN
  sequence_numbers:
  - sequence: 10
    type: permit
    description: Make routes learned over MLAG Peer-link less preferred on spines to ensure optimal routing
    set:
    - origin incomplete
- name: RM-CONN-2-BGP
  sequence_numbers:
  - sequence: 10
    type: permit
    match:
    - ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
- name: RM-CONN-2-BGP-VRFS
  sequence_numbers:
  - sequence: 10
    type: deny
    match:
    - ip address prefix-list PL-MLAG-PEER-VRFS
  - sequence: 20
    type: permit
router_bfd:
  multihop:
    interval: 300
    min_rx: 300
    multiplier: 3
router_bgp:
  as: '65201'
  router_id: 10.10.3.11
  maximum_paths:
    paths: 4
  bgp_defaults:
  - timers bgp 5 15
  - neighbor default send-community
  - neighbor default send-community extended
  bgp:
    default:
      ipv4_unicast: false
  peer_groups:
  - name: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      type: ipv4
    remote_as: '65201'
    description: DC2-LEAF1B
    next_hop_self: true
    send_community: all
    maximum_routes: 256000
    route_map_in: RM-MLAG-PEER-IN
  - name: IPv4-UNDERLAY-PEERS
    metadata:
      type: ipv4
    send_community: all
    maximum_routes: 256000
  - name: EVPN-OVERLAY-PEERS
    metadata:
      type: evpn
    update_source: Loopback0
    bfd: true
    ebgp_multihop: 3
    send_community: all
    maximum_routes: 0
  neighbors:
  - ip_address: 10.65.0.21
    peer_group: MLAG-IPv4-UNDERLAY-PEER
    metadata:
      peer: DC2-LEAF1B
    description: DC2-LEAF1B_Vlan4093
  - ip_address: 10.30.0.60
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE1
    description: DC2-SPINE1_Ethernet1/1
  - ip_address: 10.30.0.62
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE2
    description: DC2-SPINE2_Ethernet1/1
  - ip_address: 10.30.0.64
    peer_group: IPv4-UNDERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE3
    description: DC2-SPINE3_Ethernet1/1
  - ip_address: 10.10.2.8
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE1
    description: DC2-SPINE1_Loopback0
  - ip_address: 10.10.2.9
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE2
    description: DC2-SPINE2_Loopback0
  - ip_address: 10.10.2.10
    peer_group: EVPN-OVERLAY-PEERS
    remote_as: '65200'
    metadata:
      peer: DC2-SPINE3
    description: DC2-SPINE3_Loopback0
  redistribute:
    connected:
      enabled: true
      route_map: RM-CONN-2-BGP
  vlans:
  - id: 30
    metadata:
      tenants:
      - Dev
    rd: 10.10.3.11:20030
    route_targets:
      both:
      - 20030:20030
    redistribute_routes:
    - learned
  - id: 10
    metadata:
      tenants:
      - Prod
    rd: 10.10.3.11:10010
    route_targets:
      both:
      - 10010:10010
    redistribute_routes:
    - learned
  - id: 20
    metadata:
      tenants:
      - Prod
    rd: 10.10.3.11:10020
    route_targets:
      both:
      - 10020:10020
    redistribute_routes:
    - learned
  - id: 50
    metadata:
      tenants:
      - Prod
    rd: 10.10.3.11:10050
