---
# Deploy host EOS configs to CloudVision via cv_deploy role
#
# host-build.yml renders configs to DC1-information/host_configs/.
# cv_deploy expects them in DC1-information/intended/configs/, so this
# playbook copies them first before invoking the deploy role.
#
# Auth: on-prem CVP credentials from cv_dev_server in inventory.yml

- name: Deploy host configurations to CloudVision
  hosts: DC1_HOSTS
  connection: local
  gather_facts: false
  tags: [cv_deploy_hosts]

  vars:
    output_dir: "{{ playbook_dir | dirname }}/DC1-information"
    host_configs_dir: "{{ output_dir }}/host_configs"
    deploy_configs_dir: "{{ output_dir }}/configs"

  pre_tasks:
    - name: Display banner
      ansible.builtin.shell: |
        echo "╔════════════════════════════════════════════════════════════════════╗"
        echo "║                 HOST DEPLOYMENT TO CLOUDVISION                     ║"
        echo "║                                                                    ║"
        echo "║  Deploys host endpoint configurations to CloudVision Portal.       ║"
        echo "║  Copies rendered configs to deploy directory and uses cv_deploy    ║"
        echo "║  role to push host device configs to CVP for orchestration.        ║"
        echo "║                                                                    ║"
        echo "║  Status: ▶ Starting                                               ║"
        echo "╚════════════════════════════════════════════════════════════════════╝"
      register: banner
      run_once: true

    - name: Show banner
      ansible.builtin.debug:
        var: banner.stdout_lines
      run_once: true

  tasks:
    - name: Ensure deploy configs directory exists
      ansible.builtin.file:
        path: "{{ deploy_configs_dir }}"
        state: directory
        mode: '0755'
      run_once: true
      delegate_to: localhost

    - name: Verify rendered host config exists
      ansible.builtin.stat:
        path: "{{ host_configs_dir }}/{{ inventory_hostname }}.cfg"
      register: host_cfg_stat
      delegate_to: localhost

    - name: Fail if host config is missing
      ansible.builtin.assert:
        that: host_cfg_stat.stat.exists
        fail_msg: >-
          Config for {{ inventory_hostname }} not found at
          {{ host_configs_dir }}/. Run `make host-build` first.

    - name: Copy host config to deploy location where cv_deploy looks
      ansible.builtin.copy:
        src: "{{ host_configs_dir }}/{{ inventory_hostname }}.cfg"
        dest: "{{ deploy_configs_dir }}/{{ inventory_hostname }}.cfg"
        mode: '0644'
      delegate_to: localhost

    - name: Deploy host configs to CloudVision
      ansible.builtin.import_role:
        name: arista.avd.cv_deploy
      vars:
        cv_inventory_hostname: cv_dev_server
        cv_verify_certs: false
        cv_verify_devices_exist: false
        cv_run_change_control: true
        cv_register_detailed_results: true
        cv_workspace_description: "Host deploy from {{ lookup('env', 'USER') }}"
        cv_username: "{{ hostvars[cv_inventory_hostname].ansible_user }}"
        cv_password: "{{ hostvars[cv_inventory_hostname].ansible_password }}"
        cv_token: ""
